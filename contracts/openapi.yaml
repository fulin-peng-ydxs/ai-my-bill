        - { name: payerId, in: query, schema: { type: string, format: uuid } }
        - { name: incomeName, in: query, schema: { type: string, maxLength: 100 } }
        - name: range
          in: query
          schema: { $ref: "#/components/schemas/LedgerDateRange" }
        - name: startDate
          in: query
          description: range=CUSTOM 时必填。
          schema: { type: string, format: date }
        - name: endDate
          in: query
          description: range=CUSTOM 时必填，且不得早于 startDate。
          schema: { type: string, format: date }
        - name: query
          in: query
          schema: { type: string, maxLength: 200, default: "" }
        - name: cursor
          in: query
