      responses:
        "200":
          description: 启用候选；子分类仅在父分类启用时返回
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DictionaryPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /dictionaries/{type}/{itemId}:
    patch:
      operationId: renameDictionaryItem
      summary: 修改个人字典展示名称并保留历史账目快照
      tags: [personal-dictionaries]
      parameters:
        - { $ref: "#/components/parameters/DictionaryType" }
        - { $ref: "#/components/parameters/DictionaryItemId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameDictionaryItemRequest" }
      responses:
        "200": { $ref: "#/components/responses/DictionaryItem" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /dictionaries/{type}/{itemId}/status:
    post:
      operationId: changeDictionaryItemStatus
      summary: 停用或恢复个人字典项
      tags: [personal-dictionaries]
      parameters:
        - { $ref: "#/components/parameters/DictionaryType" }
        - { $ref: "#/components/parameters/DictionaryItemId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DictionaryStatusRequest" }
      responses:
        "200": { $ref: "#/components/responses/DictionaryItem" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /dictionaries/{type}/{itemId}/move:
    post:
      operationId: moveDictionaryItem
      summary: 在同级范围内上移或下移个人字典项
      tags: [personal-dictionaries]
      parameters:
        - { $ref: "#/components/parameters/DictionaryType" }
        - { $ref: "#/components/parameters/DictionaryItemId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DictionaryMoveRequest" }
      responses:
        "200": { $ref: "#/components/responses/DictionaryItem" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /dictionaries/product/{sourceProductId}/merge-preview:
    get:
      operationId: previewProductMerge
      summary: 预览商品合并对账目和日常模板的影响
      tags: [personal-dictionaries]
      parameters:
        - { $ref: "#/components/parameters/SourceProductId" }
        - name: targetProductId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 当前事务快照下的影响；确认合并时会重新计算
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductMergePreview" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /dictionaries/product/{sourceProductId}/merge:
    post:
      operationId: mergeProduct
      summary: 原子合并商品引用、模板和归属并追加不可变留痕
      tags: [personal-dictionaries]
      parameters: [{ $ref: "#/components/parameters/SourceProductId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductMergeRequest" }
      responses:
        "200":
          description: 合并完成；账目名称快照保持不变
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductMergeResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DictionaryType:
      name: type
      in: path
      required: true
      schema: { $ref: "#/components/schemas/DictionaryType" }
    DictionaryItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DefaultDictionaryType:
      name: type
      in: path
      required: true
      schema: { $ref: "#/components/schemas/DefaultDictionaryType" }
    DefaultDictionaryItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SourceProductId:
      name: sourceProductId
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    UserVersion:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UserVersionRequest" }
  responses:
    AdminUser:
      description: 用户账号状态已更新
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminUser" }
    DictionaryItem:
      description: 个人字典项已更新
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DictionaryItem" }
    DefaultDictionaryItem:
      description: 新用户默认字典项已更新
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DefaultDictionaryItem" }
    NotFoundError:
      description: 指定资源不存在或对当前身份不可见
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ValidationError:
      description: 输入校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AuthenticationError:
      description: 凭据错误或会话无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AuthorizationError:
      description: 账号状态、角色或 CSRF 校验不允许本次操作
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RateLimitError:
      description: 登录尝试过于频繁
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ConflictError:
      description: 当前资源状态、版本或唯一性约束冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServiceUnavailableError:
      description: 服务端数据存储暂不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, fieldErrors, traceId, retryable]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
          maxLength: 500
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              maxLength: 500
        traceId:
          type: string
          minLength: 1
          maxLength: 64
        retryable:
          type: boolean
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    FirstPasswordRequest:
      type: object
      additionalProperties: false
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 15
          maxLength: 64
          writeOnly: true
          description: 服务端按 Unicode code point 校验 15-64 个字符并执行离线弱密码拒绝。
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        newPassword:
          type: string
          minLength: 15
          maxLength: 64
          writeOnly: true
          description: 服务端按 Unicode code point 校验 15-64 个字符并执行离线弱密码拒绝。
    SessionResponse:
      type: object
      additionalProperties: false
      required: [accountId, username, role, passwordChangeRequired]
      properties:
        accountId:
          type: string
          format: uuid
          description: 当前账号稳定标识，用于客户端内存状态及后续草稿命名空间；不是租户标识。
        username:
          $ref: "#/components/schemas/Username"
        role:
          type: string
          enum: [ADMIN, USER]
        passwordChangeRequired:
          type: boolean
    LedgerDefaultRange:
      type: string
      enum: [TODAY, THIS_WEEK, THIS_MONTH]
    ReportDefaultRange:
      type: string
      enum: [THIS_WEEK, THIS_MONTH, LAST_MONTH, THIS_YEAR]
    ThemeMode:
      type: string
      enum: [SYSTEM, LIGHT, DARK]
    EntryType:
      type: string
      enum: [EXPENSE, INCOME]
    PreferenceRequest:
      type: object
      additionalProperties: false
      required: [ledgerDefaultRange, reportDefaultRange, themeMode, recentEntryType]
      properties:
        defaultFundingChannelId:
          type: [string, "null"]
          format: uuid
        ledgerDefaultRange: { $ref: "#/components/schemas/LedgerDefaultRange" }
        reportDefaultRange: { $ref: "#/components/schemas/ReportDefaultRange" }
        themeMode: { $ref: "#/components/schemas/ThemeMode" }
        recentEntryType: { $ref: "#/components/schemas/EntryType" }
    PreferenceResponse:
      type: object
      additionalProperties: false
      required: [ledgerDefaultRange, reportDefaultRange, themeMode, recentEntryType, updatedAt]
      properties:
        defaultFundingChannelId:
          type: [string, "null"]
          format: uuid
        defaultFundingChannelName:
          type: string
          minLength: 1
          maxLength: 100
        ledgerDefaultRange: { $ref: "#/components/schemas/LedgerDefaultRange" }
        reportDefaultRange: { $ref: "#/components/schemas/ReportDefaultRange" }
        themeMode: { $ref: "#/components/schemas/ThemeMode" }
        recentEntryType: { $ref: "#/components/schemas/EntryType" }
        updatedAt: { type: string, format: date-time }
    Username:
      type: string
      minLength: 3
      maxLength: 64
      pattern: "^[!-~]+$"
      description: 仅允许可见 ASCII 字符；租户间也保持全局唯一。
    Note:
      type: string
      maxLength: 500
      description: 去除首尾空白后最多 500 个 Unicode code point。
    Money:
      type: string
      pattern: "^(0|[1-9][0-9]{0,8})(\\.[0-9]{1,2})?$"
      description: 人民币十进制字符串，范围 0 至 999,999,999.99；需要正数的字段另加排除零值约束。
    BusinessDateTime:
      type: string
      format: date-time
      description: 服务端以收到请求时的当前时间为权威，业务日期按 Asia/Shanghai 生成。
    UnitPrice:
      type: string
      pattern: "^(0|[1-9][0-9]{0,7})(\\.[0-9]{1,4})?$"
      description: 单价十进制字符串，范围 0 至 99,999,999.9999。
    Quantity:
      type: string
      pattern: "^(0|[1-9][0-9]{0,5})(\\.[0-9]{1,3})?$"
      description: 数量十进制字符串；服务端另行校验必须大于 0，且不超过 999,999.999。
    CreateExpenseRequest:
      type: object
      additionalProperties: false
      required: [productId, primaryCategoryId, unitId, unitPrice, quantity, paidAmount, fundingChannelId, occurredAt]
      properties:
        productId: { type: string, format: uuid }
        primaryCategoryId: { type: string, format: uuid }
        secondaryCategoryId: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        unitPrice: { $ref: "#/components/schemas/UnitPrice" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        paidAmount: { $ref: "#/components/schemas/Money" }
        fundingChannelId: { type: string, format: uuid }
        purchaseChannelId: { type: string, format: uuid }
        locationLabelId: { type: string, format: uuid }
        occurredAt: { $ref: "#/components/schemas/BusinessDateTime" }
        note: { $ref: "#/components/schemas/Note" }
    UpdateExpenseRequest:
      type: object
      additionalProperties: false
      required: [version, entry]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        entry: { $ref: "#/components/schemas/CreateExpenseRequest" }
    ExpenseResponse:
      type: object
      additionalProperties: false
      required: [id, occurredAt, businessDate, productId, productName, primaryCategoryId,
        primaryCategoryName, unitId, unitName, unitPrice, quantity, calculatedAmount, paidAmount,
        effectiveAdjustmentAmount,
        fundingChannelId, fundingChannelName, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { $ref: "#/components/schemas/BusinessDateTime" }
        businessDate: { type: string, format: date }
        productId: { type: string, format: uuid }
        productName: { type: string, minLength: 1, maxLength: 200 }
        primaryCategoryId: { type: string, format: uuid }
        primaryCategoryName: { type: string, minLength: 1, maxLength: 100 }
        secondaryCategoryId: { type: string, format: uuid }
        secondaryCategoryName: { type: string, minLength: 1, maxLength: 100 }
        unitId: { type: string, format: uuid }
        unitName: { type: string, minLength: 1, maxLength: 100 }
        unitPrice: { $ref: "#/components/schemas/UnitPrice" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        calculatedAmount: { $ref: "#/components/schemas/Money" }
        paidAmount: { $ref: "#/components/schemas/Money" }
        effectiveAdjustmentAmount:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: 当前有效退款/报销合计；编辑时实付金额不得低于该值。
        fundingChannelId: { type: string, format: uuid }
        fundingChannelName: { type: string, minLength: 1, maxLength: 100 }
        purchaseChannelId: { type: string, format: uuid }
        purchaseChannelName: { type: string, minLength: 1, maxLength: 100 }
        locationLabelId: { type: string, format: uuid }
        locationLabelName: { type: string, minLength: 1, maxLength: 100 }
        note: { $ref: "#/components/schemas/Note" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    CreateIncomeRequest:
      type: object
      additionalProperties: false
      required: [incomeName, payerId, incomeCategoryId, amount, fundingChannelId, occurredAt]
      properties:
        incomeName: { type: string, minLength: 1, maxLength: 200 }
        payerId: { type: string, format: uuid }
        incomeCategoryId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        fundingChannelId: { type: string, format: uuid }
        occurredAt: { $ref: "#/components/schemas/BusinessDateTime" }
        note: { $ref: "#/components/schemas/Note" }
    UpdateIncomeRequest:
      type: object
      additionalProperties: false
      required: [version, entry]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        entry: { $ref: "#/components/schemas/CreateIncomeRequest" }
    IncomeResponse:
      type: object
      additionalProperties: false
      required: [id, occurredAt, businessDate, incomeName, payerId, payerName, incomeCategoryId,
        incomeCategoryName, amount, fundingChannelId, fundingChannelName, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { $ref: "#/components/schemas/BusinessDateTime" }
        businessDate: { type: string, format: date }
        incomeName: { type: string, minLength: 1, maxLength: 200 }
        payerId: { type: string, format: uuid }
        payerName: { type: string, minLength: 1, maxLength: 100 }
        incomeCategoryId: { type: string, format: uuid }
        incomeCategoryName: { type: string, minLength: 1, maxLength: 100 }
        amount: { $ref: "#/components/schemas/Money" }
        fundingChannelId: { type: string, format: uuid }
        fundingChannelName: { type: string, minLength: 1, maxLength: 100 }
        note: { $ref: "#/components/schemas/Note" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    IncomeNames:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 200 }
    DailyTemplateSummary:
      type: object
      additionalProperties: false
      required: [id, entryType, displayName, amount, contextName, lastUsedAt]
      properties:
        id: { type: string, format: uuid }
        entryType: { $ref: "#/components/schemas/EntryType" }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        amount: { $ref: "#/components/schemas/Money" }
        contextName: { type: string, minLength: 1, maxLength: 100 }
        lastUsedAt: { type: string, format: date-time }
    DailyTemplateList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/DailyTemplateSummary" }
    DailyTemplateSelection:
      type: object
      additionalProperties: false
      required: [id, entryType, displayName, unavailableFields]
      properties:
        id: { type: string, format: uuid }
        entryType: { $ref: "#/components/schemas/EntryType" }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        productId: { type: [string, "null"], format: uuid }
        productName: { type: [string, "null"], maxLength: 200 }
        primaryCategoryId: { type: [string, "null"], format: uuid }
        primaryCategoryName: { type: [string, "null"], maxLength: 100 }
        secondaryCategoryId: { type: [string, "null"], format: uuid }
        secondaryCategoryName: { type: [string, "null"], maxLength: 100 }
        unitId: { type: [string, "null"], format: uuid }
        unitName: { type: [string, "null"], maxLength: 100 }
        unitPrice:
          oneOf: [{ $ref: "#/components/schemas/UnitPrice" }, { type: "null" }]
        quantity:
          oneOf: [{ $ref: "#/components/schemas/Quantity" }, { type: "null" }]
        paidAmount:
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
        fundingChannelId: { type: [string, "null"], format: uuid }
        fundingChannelName: { type: [string, "null"], maxLength: 100 }
        purchaseChannelId: { type: [string, "null"], format: uuid }
        purchaseChannelName: { type: [string, "null"], maxLength: 100 }
        locationLabelId: { type: [string, "null"], format: uuid }
        locationLabelName: { type: [string, "null"], maxLength: 100 }
        incomeName: { type: [string, "null"], maxLength: 200 }
        payerId: { type: [string, "null"], format: uuid }
        payerName: { type: [string, "null"], maxLength: 100 }
        incomeCategoryId: { type: [string, "null"], format: uuid }
        incomeCategoryName: { type: [string, "null"], maxLength: 100 }
        incomeAmount:
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]
        unavailableFields:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [productId, primaryCategoryId, secondaryCategoryId, unitId, fundingChannelId,
              purchaseChannelId, locationLabelId, payerId, incomeCategoryId]
    LedgerEntryTypeFilter:
      type: string
      enum: [ALL, EXPENSE, INCOME, ADJUSTMENT]
      default: ALL
    LedgerLifecycleFilter:
      type: string
      enum: [ACTIVE, TRASHED]
      default: ACTIVE
    LedgerItemType:
      type: string
      enum: [EXPENSE, INCOME, ADJUSTMENT]
    LedgerDateRange:
      type: string
      enum: [TODAY, THIS_WEEK, THIS_MONTH, LAST_MONTH, THIS_YEAR, CUSTOM]
      default: TODAY
    ReportScope:
      type: string
      enum: [ALL, EXPENSE, INCOME]
      default: ALL
    ReportAmount:
      type: string
      pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]{2})$"
      description: 服务端精确聚合后的人民币十进制字符串；结余可为负数，聚合值不受单笔金额上限约束。
    ReportDataPoint:
      type: object
      additionalProperties: false
      required: [label, value, amount, itemCount]
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
        value: { type: string, enum: [INCOME, EXPENSE, ADJUSTMENT] }
        amount: { $ref: "#/components/schemas/ReportAmount" }
        itemCount: { type: integer, format: int64, minimum: 0 }
    ReportSummary:
      type: object
      additionalProperties: false
      required: [totalIncome, grossExpense, adjustmentAmount, netExpense, balance, matchingItemCount, dataPoints]
      properties:
        totalIncome: { $ref: "#/components/schemas/ReportAmount" }
        grossExpense: { $ref: "#/components/schemas/ReportAmount" }
        adjustmentAmount: { $ref: "#/components/schemas/ReportAmount" }
        netExpense: { $ref: "#/components/schemas/ReportAmount" }
        balance: { $ref: "#/components/schemas/ReportAmount" }
        matchingItemCount: { type: integer, format: int64, minimum: 0 }
        dataPoints:
          type: array
          items: { $ref: "#/components/schemas/ReportDataPoint" }
    ExportScope:
      type: string
      enum: [CURRENT_FILTERS, ALL_DATA]
    ExportStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED, EXPIRED]
    CreateExportRequest:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope: { $ref: "#/components/schemas/ExportScope" }
        type: { $ref: "#/components/schemas/LedgerEntryTypeFilter" }
        lifecycle: { $ref: "#/components/schemas/LedgerLifecycleFilter" }
        fundingChannelId: { type: string, format: uuid }
        range: { $ref: "#/components/schemas/LedgerDateRange" }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        query: { type: string, maxLength: 200, default: "" }
    ExportResponse:
      type: object
      additionalProperties: false
      required: [id, scope, status, rowCount, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        scope: { $ref: "#/components/schemas/ExportScope" }
        status: { $ref: "#/components/schemas/ExportStatus" }
        rowCount: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        errorMessage: { type: string, minLength: 1, maxLength: 500 }
        downloadUrl: { type: string, pattern: "^/api/v1/exports/[0-9a-f-]+/download$" }
    LedgerItem:
      type: object
      additionalProperties: false
      required: [id, entryType, occurredAt, businessDate, title, categoryName, counterpartyName,
