openapi: 3.1.0
info:
  title: 我的账单 API
  version: 0.1.0
  description: 同源 /api/v1 接口契约；T20 已开放认证、用户与字典治理、个人偏好、收支填报、统一明细生命周期、个人数据导出及报表统一筛选/摘要/下钻。
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: 获取应用与数据库健康状态
      tags: [system]
      security: []
      responses:
        "200":
          description: 应用及其必要依赖可用
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: 应用或必要依赖不可用
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /auth/login:
    post:
      operationId: login
      summary: 使用用户名和密码创建安全会话
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功；会话令牌只通过 HttpOnly Cookie 返回
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /auth/session:
    get:
      operationId: getSession
      summary: 获取当前服务端会话身份
      tags: [auth]
      responses:
        "200":
          description: 当前会话有效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /auth/logout:
    post:
      operationId: logout
      summary: 撤销当前会话并清除 Cookie
      tags: [auth]
      responses:
        "204":
          description: 会话已撤销
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /auth/first-password:
    post:
      operationId: setFirstPassword
      summary: 临时密码会话设置首次正式密码
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirstPasswordRequest"
      responses:
        "200":
          description: 密码已更新，旧会话已撤销并签发新会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /auth/password:
    post:
      operationId: changePassword
      summary: 校验当前密码后修改正式密码
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "200":
          description: 密码已更新，全部旧会话已撤销并签发新会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /me/deletion:
    post:
      operationId: deleteCurrentAccount
      summary: 注销当前普通用户并立即擦除在线个人数据
      tags: [account-deletion]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelfDeletionRequest" }
      responses:
        "200":
          description: 在线个人数据与导出文件已擦除，匿名审计保留 180 天
          content: { application/json: { schema: { $ref: "#/components/schemas/AccountDeletionResult" } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /admin/users:
    get:
      operationId: listAdminUsers
      summary: 分页查询普通用户账号白名单信息
      tags: [admin-users]
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 64, default: "" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AdminUserStatus" }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 用户账号分页；不含租户标识和账目字段
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserPage" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
    post:
      operationId: createAdminUser
      summary: 创建普通用户、独立租户和当前默认字典副本
      tags: [admin-users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAdminUserRequest" }
      responses:
        "200":
          description: 创建成功；临时密码只在本次响应中展示，有效 24 小时
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemporaryCredentialResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /preferences:
    get:
      operationId: getPreferences
      summary: 查询当前用户偏好；非法或停用引用按安全默认返回
      tags: [preferences]
      responses:
        "200":
          description: 当前用户偏好；未保存时返回默认值
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreferenceResponse" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
    put:
      operationId: savePreferences
      summary: 原子保存当前用户的完整偏好
      tags: [preferences]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreferenceRequest" }
      responses:
        "200":
          description: 已保存偏好
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreferenceResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /preferences/reset:
    post:
      operationId: resetPreferences
      summary: 删除当前用户自定义偏好并恢复默认
      tags: [preferences]
      responses:
        "200":
          description: 默认偏好
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreferenceResponse" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /expenses/products:
    get:
      operationId: listExpenseProductSuggestions
      summary: 查询当前租户启用商品及仍有效的最近默认值
      tags: [expenses]
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 200, default: "" }
      responses:
        "200":
          description: 最多二十项商品候选；停用或失效默认引用不返回
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductSuggestions" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /expenses:
    post:
      operationId: createExpense
      summary: 幂等保存当前租户的一条商品支出
      tags: [expenses]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateExpenseRequest" }
      responses:
        "201":
          description: 支出创建成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseResponse" }
        "200":
          description: 相同幂等标识和请求内容的既有成功结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /expenses/{expenseId}/undo:
    delete:
      operationId: undoCreatedExpense
      summary: 撤销尚无下游关联的刚保存支出
      tags: [expenses]
      parameters:
        - name: expenseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
          description: 必须与创建该笔支出时使用的幂等标识一致，只允许撤销对应的刚保存记录。
      responses:
        "204": { description: 本次保存已撤销 }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /expenses/{expenseId}:
    get:
      operationId: getExpense
      summary: 读取当前租户的一条有效支出供查看或编辑
      tags: [expenses]
      parameters:
        - name: expenseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 支出当前字段、快照与乐观锁版本
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseResponse" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
    put:
      operationId: updateExpense
      summary: 按版本更新当前租户的一条有效支出
      tags: [expenses]
      parameters:
        - name: expenseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateExpenseRequest" }
      responses:
        "200":
          description: 更新后的支出，version 已递增
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /incomes/names:
    get:
      operationId: listRecentIncomeNames
      summary: 查询当前租户最近使用的收入名称
      tags: [incomes]
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 200, default: "" }
      responses:
        "200":
          description: 按最近使用时间排序的最多二十个非唯一名称
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncomeNames" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
  /incomes:
    post:
      operationId: createIncome
      summary: 幂等保存当前租户的一条收入
      tags: [incomes]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIncomeRequest" }
      responses:
        "201":
          description: 收入创建成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncomeResponse" }
        "200":
          description: 相同幂等标识和请求内容的既有成功结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncomeResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /incomes/{incomeId}/undo:
    delete:
      operationId: undoCreatedIncome
      summary: 撤销尚无模板关联的刚保存收入
      tags: [incomes]
      parameters:
        - name: incomeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "204": { description: 本次保存已撤销 }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /incomes/{incomeId}:
    get:
      operationId: getIncome
      summary: 读取当前租户的一条有效收入供查看或编辑
      tags: [incomes]
      parameters:
        - name: incomeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 收入当前字段、快照与乐观锁版本
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncomeResponse" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
    put:
      operationId: updateIncome
      summary: 按版本更新当前租户的一条有效收入
      tags: [incomes]
      parameters:
        - name: incomeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateIncomeRequest" }
      responses:
        "200":
          description: 更新后的收入，version 已递增
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncomeResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /daily-templates:
    get:
      operationId: listDailyTemplates
      summary: 按最近使用时间查询当前租户的日常模板
      tags: [daily-templates]
      parameters:
        - name: type
          in: query
          required: true
          schema: { $ref: "#/components/schemas/EntryType" }
      responses:
        "200":
          description: 最多一百项当前类型模板
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyTemplateList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
  /exports:
    post:
      operationId: createPersonalExport
      summary: 按当前筛选快照或全部个人数据创建异步 CSV 导出
      tags: [exports]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateExportRequest" }
      responses:
        "200":
          description: 已创建或幂等返回本人导出任务
          content: { application/json: { schema: { $ref: "#/components/schemas/ExportResponse" } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /exports/{exportId}:
    get:
      operationId: getPersonalExport
      summary: 查询本人导出任务状态与安全下载入口
      tags: [exports]
      parameters:
        - { name: exportId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: 导出任务状态, content: { application/json: { schema: { $ref: "#/components/schemas/ExportResponse" } } } }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
  /exports/{exportId}/cancel:
    post:
      operationId: cancelPersonalExport
      summary: 取消本人尚未完成的导出任务
      tags: [exports]
      parameters:
        - { name: exportId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: 取消结果或当前终态, content: { application/json: { schema: { $ref: "#/components/schemas/ExportResponse" } } } }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
  /exports/{exportId}/download:
    get:
      operationId: downloadPersonalExport
      summary: 下载本人尚未过期的 CSV 导出文件
      tags: [exports]
      parameters:
        - { name: exportId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: UTF-8 BOM CSV；文本字段已进行电子表格公式防护
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            text/csv: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "410": { description: 文件已过期或已清理, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /reports/summary:
    get:
      operationId: getReportSummary
      summary: 按统一筛选口径聚合当前租户有效收支与生效调整
      tags: [reports]
      parameters:
        - { name: scope, in: query, schema: { $ref: "#/components/schemas/ReportScope" } }
        - { name: range, in: query, schema: { $ref: "#/components/schemas/LedgerDateRange" } }
        - { name: startDate, in: query, description: range=CUSTOM 时必填。, schema: { type: string, format: date } }
        - { name: endDate, in: query, description: range=CUSTOM 时必填且不得早于 startDate。, schema: { type: string, format: date } }
        - { name: query, in: query, schema: { type: string, maxLength: 200, default: "" } }
        - { name: fundingChannelId, in: query, schema: { type: string, format: uuid } }
        - { name: primaryCategoryId, in: query, schema: { type: string, format: uuid } }
        - { name: secondaryCategoryId, in: query, schema: { type: string, format: uuid } }
        - { name: productId, in: query, schema: { type: string, format: uuid } }
        - { name: purchaseChannelId, in: query, schema: { type: string, format: uuid } }
        - { name: locationLabelId, in: query, schema: { type: string, format: uuid } }
        - { name: incomeCategoryId, in: query, schema: { type: string, format: uuid } }
        - { name: payerId, in: query, schema: { type: string, format: uuid } }
        - { name: incomeName, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: 全部指标与数据点使用同一筛选快照；冲减为生效退款/报销正数。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportSummary" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /ledger-entries:
    get:
      operationId: listLedgerEntries
      summary: 按稳定游标查询当前租户的有效账目或回收站
      tags: [ledger]
      parameters:
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/LedgerEntryTypeFilter" }
