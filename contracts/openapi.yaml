openapi: 3.1.0
info:
  title: 我的账单 API
  version: 0.1.0
  description: 同源 /api/v1 接口契约；T11 已开放认证、管理员用户生命周期、个人字典、商品合并、管理员默认字典、个人偏好、支出填报与最小健康检查。
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: 获取应用与数据库健康状态
      tags: [system]
      security: []
      responses:
        "200":
          description: 应用及其必要依赖可用
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: 应用或必要依赖不可用
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /auth/login:
    post:
      operationId: login
      summary: 使用用户名和密码创建安全会话
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功；会话令牌只通过 HttpOnly Cookie 返回
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /auth/session:
    get:
      operationId: getSession
      summary: 获取当前服务端会话身份
      tags: [auth]
      responses:
        "200":
          description: 当前会话有效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /auth/logout:
    post:
      operationId: logout
      summary: 撤销当前会话并清除 Cookie
      tags: [auth]
      responses:
        "204":
          description: 会话已撤销
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /auth/first-password:
    post:
      operationId: setFirstPassword
      summary: 临时密码会话设置首次正式密码
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirstPasswordRequest"
      responses:
        "200":
          description: 密码已更新，旧会话已撤销并签发新会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /auth/password:
    post:
      operationId: changePassword
      summary: 校验当前密码后修改正式密码
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "200":
          description: 密码已更新，全部旧会话已撤销并签发新会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /admin/users:
    get:
      operationId: listAdminUsers
      summary: 分页查询普通用户账号白名单信息
      tags: [admin-users]
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 64, default: "" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AdminUserStatus" }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 用户账号分页；不含租户标识和账目字段
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserPage" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
    post:
      operationId: createAdminUser
      summary: 创建普通用户、独立租户和当前默认字典副本
      tags: [admin-users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAdminUserRequest" }
      responses:
        "200":
          description: 创建成功；临时密码只在本次响应中展示，有效 24 小时
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemporaryCredentialResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /preferences:
    get:
      operationId: getPreferences
      summary: 查询当前用户偏好；非法或停用引用按安全默认返回
      tags: [preferences]
      responses:
        "200":
          description: 当前用户偏好；未保存时返回默认值
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreferenceResponse" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
    put:
      operationId: savePreferences
      summary: 原子保存当前用户的完整偏好
      tags: [preferences]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreferenceRequest" }
      responses:
        "200":
          description: 已保存偏好
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreferenceResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /preferences/reset:
    post:
      operationId: resetPreferences
      summary: 删除当前用户自定义偏好并恢复默认
      tags: [preferences]
      responses:
        "200":
          description: 默认偏好
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreferenceResponse" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /expenses/products:
    get:
      operationId: listExpenseProductSuggestions
      summary: 查询当前租户启用商品及仍有效的最近默认值
      tags: [expenses]
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 200, default: "" }
      responses:
        "200":
          description: 最多二十项商品候选；停用或失效默认引用不返回
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductSuggestions" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /expenses:
    post:
      operationId: createExpense
      summary: 幂等保存当前租户的一条商品支出
      tags: [expenses]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateExpenseRequest" }
      responses:
        "201":
          description: 支出创建成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseResponse" }
        "200":
          description: 相同幂等标识和请求内容的既有成功结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /expenses/{expenseId}/undo:
    delete:
      operationId: undoCreatedExpense
      summary: 撤销尚无下游关联的刚保存支出
      tags: [expenses]
      parameters:
        - name: expenseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
          description: 必须与创建该笔支出时使用的幂等标识一致，只允许撤销对应的刚保存记录。
      responses:
        "204": { description: 本次保存已撤销 }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /admin/users/{userId}/disable:
    post:
      operationId: disableAdminUser
      summary: 停用普通用户并撤销全部会话
      tags: [admin-users]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody: { $ref: "#/components/requestBodies/UserVersion" }
      responses: { "200": { $ref: "#/components/responses/AdminUser" }, "401": { $ref: "#/components/responses/AuthenticationError" }, "403": { $ref: "#/components/responses/AuthorizationError" }, "404": { $ref: "#/components/responses/NotFoundError" }, "409": { $ref: "#/components/responses/ConflictError" }, "503": { $ref: "#/components/responses/ServiceUnavailableError" } }
  /admin/users/{userId}/restore:
    post:
      operationId: restoreAdminUser
      summary: 恢复普通用户账号
      tags: [admin-users]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody: { $ref: "#/components/requestBodies/UserVersion" }
      responses: { "200": { $ref: "#/components/responses/AdminUser" }, "401": { $ref: "#/components/responses/AuthenticationError" }, "403": { $ref: "#/components/responses/AuthorizationError" }, "404": { $ref: "#/components/responses/NotFoundError" }, "409": { $ref: "#/components/responses/ConflictError" }, "503": { $ref: "#/components/responses/ServiceUnavailableError" } }
  /admin/users/{userId}/reset-password:
    post:
      operationId: resetAdminUserPassword
      summary: 重置临时密码并撤销全部旧会话
      tags: [admin-users]
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      requestBody: { $ref: "#/components/requestBodies/UserVersion" }
      responses: { "200": { description: 新临时密码仅本次展示, content: { application/json: { schema: { $ref: "#/components/schemas/TemporaryCredentialResponse" } } } }, "401": { $ref: "#/components/responses/AuthenticationError" }, "403": { $ref: "#/components/responses/AuthorizationError" }, "404": { $ref: "#/components/responses/NotFoundError" }, "409": { $ref: "#/components/responses/ConflictError" }, "503": { $ref: "#/components/responses/ServiceUnavailableError" } }
  /admin/default-dictionaries:
    get:
      operationId: listDefaultDictionarySummaries
      summary: 查询五类新用户默认字典数量
      tags: [admin-default-dictionaries]
      responses:
        "200":
          description: 五类默认字典的总数和启用数；不含任何租户数据
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefaultDictionarySummaries" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /admin/default-dictionaries/{type}:
    get:
      operationId: listDefaultDictionaryItems
      summary: 分页查询一类新用户默认字典
      tags: [admin-default-dictionaries]
      parameters:
        - { $ref: "#/components/parameters/DefaultDictionaryType" }
        - name: query
          in: query
          schema: { type: string, maxLength: 64, default: "" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/DictionaryStatus" }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: 默认字典项分页；只影响之后创建用户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefaultDictionaryPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
    post:
      operationId: createDefaultDictionaryItem
      summary: 新增只供以后新用户复制的默认字典项
      tags: [admin-default-dictionaries]
      parameters: [{ $ref: "#/components/parameters/DefaultDictionaryType" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDefaultDictionaryItemRequest" }
      responses:
        "200": { $ref: "#/components/responses/DefaultDictionaryItem" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /admin/default-dictionaries/{type}/{itemId}/status:
    post:
      operationId: changeDefaultDictionaryItemStatus
      summary: 停用或恢复新用户默认字典项
      tags: [admin-default-dictionaries]
      parameters:
        - { $ref: "#/components/parameters/DefaultDictionaryType" }
        - { $ref: "#/components/parameters/DefaultDictionaryItemId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DictionaryStatusRequest" }
      responses:
        "200": { $ref: "#/components/responses/DefaultDictionaryItem" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /admin/default-dictionaries/{type}/{itemId}/move:
    post:
      operationId: moveDefaultDictionaryItem
      summary: 在同级范围内调整新用户默认字典顺序
      tags: [admin-default-dictionaries]
      parameters:
        - { $ref: "#/components/parameters/DefaultDictionaryType" }
        - { $ref: "#/components/parameters/DefaultDictionaryItemId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DictionaryMoveRequest" }
      responses:
        "200": { $ref: "#/components/responses/DefaultDictionaryItem" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /dictionaries:
    get:
      operationId: listDictionarySummaries
      summary: 查询当前用户八类个人字典数量
      tags: [personal-dictionaries]
      responses:
        "200":
          description: 各类总数与启用数
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DictionarySummaries" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /dictionaries/{type}:
    get:
      operationId: listDictionaryItems
      summary: 分页查询一个真实个人字典
      tags: [personal-dictionaries]
      parameters:
        - { $ref: "#/components/parameters/DictionaryType" }
        - name: query
          in: query
          schema: { type: string, maxLength: 64, default: "" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/DictionaryStatus" }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: 字典项分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DictionaryPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
    post:
      operationId: createDictionaryItem
      summary: 新增个人字典项
      tags: [personal-dictionaries]
      parameters: [{ $ref: "#/components/parameters/DictionaryType" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDictionaryItemRequest" }
      responses:
        "200": { $ref: "#/components/responses/DictionaryItem" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /dictionaries/{type}/candidates:
    get:
      operationId: listDictionaryCandidates
      summary: 查询填报可用的启用候选项
      tags: [personal-dictionaries]
      parameters:
        - { $ref: "#/components/parameters/DictionaryType" }
        - name: query
          in: query
          schema: { type: string, maxLength: 64, default: "" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: 启用候选；子分类仅在父分类启用时返回
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DictionaryPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /dictionaries/{type}/{itemId}:
    patch:
      operationId: renameDictionaryItem
      summary: 修改个人字典展示名称并保留历史账目快照
      tags: [personal-dictionaries]
      parameters:
        - { $ref: "#/components/parameters/DictionaryType" }
        - { $ref: "#/components/parameters/DictionaryItemId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameDictionaryItemRequest" }
      responses:
        "200": { $ref: "#/components/responses/DictionaryItem" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /dictionaries/{type}/{itemId}/status:
    post:
      operationId: changeDictionaryItemStatus
      summary: 停用或恢复个人字典项
      tags: [personal-dictionaries]
      parameters:
        - { $ref: "#/components/parameters/DictionaryType" }
        - { $ref: "#/components/parameters/DictionaryItemId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DictionaryStatusRequest" }
      responses:
        "200": { $ref: "#/components/responses/DictionaryItem" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /dictionaries/{type}/{itemId}/move:
    post:
      operationId: moveDictionaryItem
      summary: 在同级范围内上移或下移个人字典项
      tags: [personal-dictionaries]
      parameters:
        - { $ref: "#/components/parameters/DictionaryType" }
        - { $ref: "#/components/parameters/DictionaryItemId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DictionaryMoveRequest" }
      responses:
        "200": { $ref: "#/components/responses/DictionaryItem" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /dictionaries/product/{sourceProductId}/merge-preview:
    get:
      operationId: previewProductMerge
      summary: 预览商品合并对账目和日常模板的影响
      tags: [personal-dictionaries]
      parameters:
        - { $ref: "#/components/parameters/SourceProductId" }
        - name: targetProductId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 当前事务快照下的影响；确认合并时会重新计算
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductMergePreview" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
  /dictionaries/product/{sourceProductId}/merge:
    post:
      operationId: mergeProduct
      summary: 原子合并商品引用、模板和归属并追加不可变留痕
      tags: [personal-dictionaries]
      parameters: [{ $ref: "#/components/parameters/SourceProductId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductMergeRequest" }
      responses:
        "200":
          description: 合并完成；账目名称快照保持不变
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductMergeResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "503": { $ref: "#/components/responses/ServiceUnavailableError" }
components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DictionaryType:
      name: type
      in: path
      required: true
      schema: { $ref: "#/components/schemas/DictionaryType" }
    DictionaryItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DefaultDictionaryType:
      name: type
      in: path
      required: true
      schema: { $ref: "#/components/schemas/DefaultDictionaryType" }
    DefaultDictionaryItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SourceProductId:
      name: sourceProductId
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    UserVersion:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UserVersionRequest" }
  responses:
    AdminUser:
      description: 用户账号状态已更新
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminUser" }
    DictionaryItem:
      description: 个人字典项已更新
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DictionaryItem" }
    DefaultDictionaryItem:
      description: 新用户默认字典项已更新
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DefaultDictionaryItem" }
    NotFoundError:
      description: 指定资源不存在或对当前身份不可见
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ValidationError:
      description: 输入校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AuthenticationError:
      description: 凭据错误或会话无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AuthorizationError:
      description: 账号状态、角色或 CSRF 校验不允许本次操作
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RateLimitError:
      description: 登录尝试过于频繁
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ConflictError:
      description: 当前资源状态、版本或唯一性约束冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServiceUnavailableError:
      description: 服务端数据存储暂不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, fieldErrors, traceId, retryable]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
          maxLength: 500
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              maxLength: 500
        traceId:
          type: string
          minLength: 1
          maxLength: 64
        retryable:
          type: boolean
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    FirstPasswordRequest:
      type: object
      additionalProperties: false
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 15
          maxLength: 64
          writeOnly: true
          description: 服务端按 Unicode code point 校验 15-64 个字符并执行离线弱密码拒绝。
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        newPassword:
          type: string
          minLength: 15
          maxLength: 64
          writeOnly: true
          description: 服务端按 Unicode code point 校验 15-64 个字符并执行离线弱密码拒绝。
    SessionResponse:
      type: object
      additionalProperties: false
      required: [accountId, username, role, passwordChangeRequired]
      properties:
        accountId:
          type: string
          format: uuid
          description: 当前账号稳定标识，用于客户端内存状态及后续草稿命名空间；不是租户标识。
        username:
          $ref: "#/components/schemas/Username"
        role:
          type: string
          enum: [ADMIN, USER]
        passwordChangeRequired:
          type: boolean
    LedgerDefaultRange:
      type: string
      enum: [TODAY, THIS_WEEK, THIS_MONTH]
    ReportDefaultRange:
      type: string
      enum: [THIS_WEEK, THIS_MONTH, LAST_MONTH, THIS_YEAR]
    ThemeMode:
      type: string
      enum: [SYSTEM, LIGHT, DARK]
    EntryType:
      type: string
      enum: [EXPENSE, INCOME]
    PreferenceRequest:
      type: object
      additionalProperties: false
      required: [ledgerDefaultRange, reportDefaultRange, themeMode, recentEntryType]
      properties:
        defaultFundingChannelId:
          type: [string, "null"]
          format: uuid
        ledgerDefaultRange: { $ref: "#/components/schemas/LedgerDefaultRange" }
        reportDefaultRange: { $ref: "#/components/schemas/ReportDefaultRange" }
        themeMode: { $ref: "#/components/schemas/ThemeMode" }
        recentEntryType: { $ref: "#/components/schemas/EntryType" }
    PreferenceResponse:
      type: object
      additionalProperties: false
      required: [ledgerDefaultRange, reportDefaultRange, themeMode, recentEntryType, updatedAt]
      properties:
        defaultFundingChannelId:
          type: [string, "null"]
          format: uuid
        defaultFundingChannelName:
          type: string
          minLength: 1
          maxLength: 100
        ledgerDefaultRange: { $ref: "#/components/schemas/LedgerDefaultRange" }
        reportDefaultRange: { $ref: "#/components/schemas/ReportDefaultRange" }
        themeMode: { $ref: "#/components/schemas/ThemeMode" }
        recentEntryType: { $ref: "#/components/schemas/EntryType" }
        updatedAt: { type: string, format: date-time }
    Username:
      type: string
      minLength: 3
      maxLength: 64
      pattern: "^[!-~]+$"
      description: 仅允许可见 ASCII 字符；租户间也保持全局唯一。
    Note:
      type: string
      maxLength: 500
      description: 去除首尾空白后最多 500 个 Unicode code point。
    Money:
      type: string
      pattern: "^(0|[1-9][0-9]{0,8})(\\.[0-9]{1,2})?$"
      description: 人民币十进制字符串，范围 0 至 999,999,999.99；需要正数的字段另加排除零值约束。
    BusinessDateTime:
      type: string
      format: date-time
      description: 服务端以收到请求时的当前时间为权威，业务日期按 Asia/Shanghai 生成。
    UnitPrice:
      type: string
      pattern: "^(0|[1-9][0-9]{0,7})(\\.[0-9]{1,4})?$"
      description: 单价十进制字符串，范围 0 至 99,999,999.9999。
    Quantity:
      type: string
      pattern: "^(0|[1-9][0-9]{0,5})(\\.[0-9]{1,3})?$"
      description: 数量十进制字符串；服务端另行校验必须大于 0，且不超过 999,999.999。
    CreateExpenseRequest:
      type: object
      additionalProperties: false
      required: [productId, primaryCategoryId, unitId, unitPrice, quantity, paidAmount, fundingChannelId, occurredAt]
      properties:
        productId: { type: string, format: uuid }
        primaryCategoryId: { type: string, format: uuid }
        secondaryCategoryId: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        unitPrice: { $ref: "#/components/schemas/UnitPrice" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        paidAmount: { $ref: "#/components/schemas/Money" }
        fundingChannelId: { type: string, format: uuid }
        purchaseChannelId: { type: string, format: uuid }
        locationLabelId: { type: string, format: uuid }
        occurredAt: { $ref: "#/components/schemas/BusinessDateTime" }
        note: { $ref: "#/components/schemas/Note" }
    ExpenseResponse:
      type: object
      additionalProperties: false
      required: [id, occurredAt, businessDate, productId, productName, primaryCategoryId,
        primaryCategoryName, unitId, unitName, unitPrice, quantity, calculatedAmount, paidAmount,
        fundingChannelId, fundingChannelName, createdAt]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { $ref: "#/components/schemas/BusinessDateTime" }
        businessDate: { type: string, format: date }
        productId: { type: string, format: uuid }
        productName: { type: string, minLength: 1, maxLength: 200 }
        primaryCategoryId: { type: string, format: uuid }
        primaryCategoryName: { type: string, minLength: 1, maxLength: 100 }
        secondaryCategoryId: { type: string, format: uuid }
        secondaryCategoryName: { type: string, minLength: 1, maxLength: 100 }
        unitId: { type: string, format: uuid }
        unitName: { type: string, minLength: 1, maxLength: 100 }
        unitPrice: { $ref: "#/components/schemas/UnitPrice" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        calculatedAmount: { $ref: "#/components/schemas/Money" }
        paidAmount: { $ref: "#/components/schemas/Money" }
        fundingChannelId: { type: string, format: uuid }
        fundingChannelName: { type: string, minLength: 1, maxLength: 100 }
        purchaseChannelId: { type: string, format: uuid }
        purchaseChannelName: { type: string, minLength: 1, maxLength: 100 }
        locationLabelId: { type: string, format: uuid }
        locationLabelName: { type: string, minLength: 1, maxLength: 100 }
        note: { $ref: "#/components/schemas/Note" }
        createdAt: { type: string, format: date-time }
    ProductSuggestion:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        primaryCategoryId: { type: string, format: uuid }
        primaryCategoryName: { type: string, minLength: 1, maxLength: 100 }
        secondaryCategoryId: { type: string, format: uuid }
        secondaryCategoryName: { type: string, minLength: 1, maxLength: 100 }
        unitId: { type: string, format: uuid }
        unitName: { type: string, minLength: 1, maxLength: 100 }
        lastUnitPrice: { $ref: "#/components/schemas/UnitPrice" }
        fundingChannelId: { type: string, format: uuid }
        fundingChannelName: { type: string, minLength: 1, maxLength: 100 }
        purchaseChannelId: { type: string, format: uuid }
        purchaseChannelName: { type: string, minLength: 1, maxLength: 100 }
    ProductSuggestions:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ProductSuggestion" }
    AdminUserStatus:
      type: string
      enum: [ACTIVE, PENDING_FIRST_LOGIN, DISABLED, DELETION_PENDING]
    DictionaryType:
      type: string
      enum: [product, expense-category, unit, funding-channel, purchase-channel, location, income-category, payer]
    DictionaryStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    DictionaryItem:
      type: object
      additionalProperties: false
      required: [id, type, name, status, sortOrder, referenced]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/DictionaryType" }
        name: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: "#/components/schemas/DictionaryStatus" }
        sortOrder: { type: integer, minimum: 0 }
        parentId: { type: string, format: uuid }
        parentName: { type: string, minLength: 1, maxLength: 100 }
        referenced: { type: boolean }
    DictionaryPage:
      type: object
      additionalProperties: false
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DictionaryItem" }
        total: { type: integer, format: int64, minimum: 0 }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
    DictionarySummary:
      type: object
      additionalProperties: false
      required: [type, total, active]
      properties:
        type: { $ref: "#/components/schemas/DictionaryType" }
        total: { type: integer, format: int64, minimum: 0 }
        active: { type: integer, format: int64, minimum: 0 }
    DictionarySummaries:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 8
          maxItems: 8
          items: { $ref: "#/components/schemas/DictionarySummary" }
    CreateDictionaryItemRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        parentId: { type: string, format: uuid }
    RenameDictionaryItemRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    DictionaryStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/DictionaryStatus" }
    DictionaryMoveRequest:
      type: object
      additionalProperties: false
      required: [direction]
      properties:
        direction: { type: string, enum: [UP, DOWN] }
    ProductIdentity:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
    ProductMergePreview:
      type: object
      additionalProperties: false
      required: [source, target, affectedLedgerEntries, affectedTemplates, templateConflict]
      properties:
        source: { $ref: "#/components/schemas/ProductIdentity" }
        target: { $ref: "#/components/schemas/ProductIdentity" }
        affectedLedgerEntries: { type: integer, format: int64, minimum: 0 }
        affectedTemplates: { type: integer, minimum: 0, maximum: 1 }
        templateConflict: { type: boolean }
    ProductMergeRequest:
      type: object
      additionalProperties: false
      required: [targetProductId]
      properties:
        targetProductId: { type: string, format: uuid }
    ProductMergeResult:
      type: object
      additionalProperties: false
      required: [mergeEventId, impact]
      properties:
        mergeEventId: { type: string, format: uuid }
        impact: { $ref: "#/components/schemas/ProductMergePreview" }
    DefaultDictionaryType:
      type: string
      enum: [expense-category, income-category, unit, funding-channel, purchase-channel]
    DefaultDictionaryItem:
      type: object
      additionalProperties: false
      required: [id, type, name, status, sortOrder]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/DefaultDictionaryType" }
        name: { type: string, minLength: 1, maxLength: 100 }
        status: { $ref: "#/components/schemas/DictionaryStatus" }
        sortOrder: { type: integer, minimum: 0 }
        parentId: { type: string, format: uuid }
        parentName: { type: string, minLength: 1, maxLength: 100 }
    DefaultDictionaryPage:
      type: object
      additionalProperties: false
      required: [items, total, page, size]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DefaultDictionaryItem" } }
        total: { type: integer, format: int64, minimum: 0 }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
    DefaultDictionarySummary:
      type: object
      additionalProperties: false
      required: [type, total, active]
      properties:
        type: { $ref: "#/components/schemas/DefaultDictionaryType" }
        total: { type: integer, format: int64, minimum: 0 }
        active: { type: integer, format: int64, minimum: 0 }
    DefaultDictionarySummaries:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 5
          maxItems: 5
          items: { $ref: "#/components/schemas/DefaultDictionarySummary" }
    CreateDefaultDictionaryItemRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        parentId: { type: string, format: uuid }
    CreateAdminUserRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username: { $ref: "#/components/schemas/Username" }
    UserVersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, format: int64, minimum: 1 }
    AdminUser:
      type: object
      additionalProperties: false
      required: [accountId, username, status, registeredAt, version]
      properties:
        accountId: { type: string, format: uuid }
        username: { $ref: "#/components/schemas/Username" }
        status: { $ref: "#/components/schemas/AdminUserStatus" }
        registeredAt: { type: string, format: date-time }
        lastActiveAt:
          type: string
          format: date-time
          description: 尚无活跃记录时省略。
        temporaryPasswordExpiresAt:
          type: string
          format: date-time
          description: 已设置正式密码时省略。
        version: { type: integer, format: int64, minimum: 1 }
    AdminUserPage:
      type: object
      additionalProperties: false
      required: [items, total, page, size]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
        total: { type: integer, format: int64, minimum: 0 }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
    TemporaryCredentialResponse:
      type: object
      additionalProperties: false
      required: [user, temporaryPassword, expiresAt]
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }
        temporaryPassword:
          type: string
          minLength: 16
          maxLength: 16
          description: 只在本次成功响应展示，服务端不得再次查询明文。
        expiresAt: { type: string, format: date-time }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: MY_BILL_SESSION
