<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="__THEME_LIGHT_BACKGROUND__">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="__THEME_DARK_BACKGROUND__">
    <title>当前离线 · 我的账单</title>
    <style>
      __THEME_COLOR_CSS__
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, system-ui, "PingFang SC", sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-width: 320px; min-height: 100dvh; place-items: center; margin: 0; padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); color: var(--color-text); background: var(--color-background); }
      main { width: min(100%, 440px); padding: 24px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 18px; }
      h1 { margin: 0 0 8px; font-size: 28px; line-height: 34px; }
      p { margin: 0; color: var(--color-muted); font-size: 17px; line-height: 25px; }
    </style>
  </head>
  <body>
    <main>
      <h1>当前没有网络</h1>
      <p>账单数据不会从缓存中显示。恢复网络后重新打开页面即可继续。</p>
    </main>
  </body>
</html>
