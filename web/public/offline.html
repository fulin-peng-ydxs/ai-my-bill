<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F5F5F7">
    <title>当前离线 · 我的账单</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, system-ui, "PingFang SC", sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-width: 320px; min-height: 100dvh; place-items: center; margin: 0; padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); color: #1D1D1F; background: #F5F5F7; }
      main { width: min(100%, 440px); padding: 24px; background: #FFFFFF; border: 1px solid #E0E0E0; border-radius: 18px; }
      h1 { margin: 0 0 8px; font-size: 28px; line-height: 34px; }
      p { margin: 0; color: #6E6E73; font-size: 17px; line-height: 25px; }
      @media (prefers-color-scheme: dark) { body { color: #FFFFFF; background: #000000; } main { background: #272729; border-color: #333333; } p { color: #CCCCCC; } }
    </style>
  </head>
  <body>
    <main>
      <h1>当前没有网络</h1>
      <p>账单数据不会从缓存中显示。恢复网络后重新打开页面即可继续。</p>
    </main>
  </body>
</html>
