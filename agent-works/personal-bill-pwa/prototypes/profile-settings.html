<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F6F7FB"><title>我的 · 我的账单原型</title>
  <script>try{const m=localStorage.getItem('bill-prototype-theme')||'system';document.documentElement.dataset.theme=m==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):m}catch(e){}</script><link rel="stylesheet" href="prototype.css">
</head><body><div class="app"><main class="mobile-shell"><div class="page"><div data-page-content>
  <header class="page-head"><div><h1 class="page-title">我的</h1><p class="page-subtitle">用户示例 A · 正常</p></div><span class="tag success">数据仅自己可见</span></header>
  <section class="setting-group"><h2 class="setting-group-title">填报偏好</h2><div class="setting-list"><button class="setting-row" data-open="payment-pref"><span>默认资金渠道</span><span class="setting-value">微信 · 修改</span></button><button class="setting-row" data-toast="最近记账类型将按使用自动保存"><span>最近记账类型</span><span class="setting-value">收入 · 自动</span></button><button class="setting-row" data-toast="报表默认范围已切换为本月"><span>报表默认范围</span><span class="setting-value">本月 · 修改</span></button></div></section>
  <section class="setting-group"><h2 class="setting-group-title">外观</h2><div class="panel"><div class="section-head"><div><strong>主题模式</strong><div class="caption">登录后跨设备保存</div></div></div><div class="theme-segment" style="width:100%" aria-label="主题模式"><button data-theme-mode="system">跟随系统</button><button data-theme-mode="light">白天</button><button data-theme-mode="dark">夜晚</button></div></div></section>
  <section class="setting-group"><h2 class="setting-group-title">我的字典</h2><div class="setting-list"><button class="setting-row" data-dictionary="商品"><span>商品</span><span class="setting-value">36 项 · 管理</span></button><button class="setting-row" data-dictionary="支出分类"><span>支出分类</span><span class="setting-value">12 项 · 管理</span></button><button class="setting-row" data-dictionary="收入分类"><span>收入分类</span><span class="setting-value">8 项 · 管理</span></button><button class="setting-row" data-dictionary="付款方"><span>付款方</span><span class="setting-value">5 项 · 管理</span></button><button class="setting-row" data-dictionary="单位"><span>单位</span><span class="setting-value">8 项 · 管理</span></button><button class="setting-row" data-dictionary="资金渠道"><span>资金渠道</span><span class="setting-value">4 项 · 管理</span></button><button class="setting-row" data-dictionary="购买渠道"><span>购买渠道</span><span class="setting-value">6 项 · 管理</span></button><button class="setting-row" data-dictionary="常用地点"><span>常用地点</span><span class="setting-value">2 项 · 管理</span></button></div></section>
  <section class="setting-group"><h2 class="setting-group-title">数据与安全</h2><div class="setting-list"><button class="setting-row" data-toast="正在准备你的个人账单 CSV"><span>导出我的数据</span><span class="setting-value">CSV</span></button><button class="setting-row" data-toast="已打开密码修改；正式密码需 15-64 位且不得为常见或泄露密码"><span>修改密码</span><span class="setting-value">打开</span></button><button class="setting-row" data-toast="已安全退出（原型演示）"><span>退出登录</span><span class="setting-value">退出</span></button><button class="setting-row" data-open="account-dialog"><span style="color:var(--danger)">注销账号</span><span class="setting-value">申请</span></button></div></section>
  <div class="prototype-note"><strong>状态验证</strong>八类字典打开各自命名的管理视图；收入名称不建唯一字典，仅提供最近使用。系统默认字典不会覆盖个人副本。</div>
</div></div><nav class="bottom-nav" aria-label="主导航"><a class="nav-item" href="expense-entry.html"><span data-icon="add"></span><span>记一笔</span></a><a class="nav-item" href="reports.html"><span data-icon="chart"></span><span>报表</span></a><a class="nav-item" href="bill-details.html"><span data-icon="list"></span><span>明细</span></a><a class="nav-item active" href="profile-settings.html"><span data-icon="user"></span><span>我的</span></a></nav></main></div>
<div class="overlay" id="payment-pref"><section class="sheet" role="dialog" aria-modal="true"><div class="sheet-handle"></div><div class="sheet-head"><div><h2 class="sheet-title">默认资金渠道</h2><div class="caption">支出显示支付方式，收入显示收款方式</div></div><button class="icon-btn" data-close aria-label="关闭"><span data-icon="close"></span></button></div><div class="chip-row" data-chip-group><button class="chip active">微信</button><button class="chip">支付宝</button><button class="chip">银行卡</button><button class="chip">现金</button></div><button class="btn primary" style="width:100%;margin-top:18px" data-close-after="默认资金渠道已保存">保存偏好</button></section></div>
<div class="overlay" id="dictionary-sheet"><section class="sheet" role="dialog" aria-modal="true"><div class="sheet-handle"></div><div class="sheet-head"><div><h2 class="sheet-title" data-dictionary-title>字典管理</h2><div class="caption">新增、改名、排序、停用或恢复</div></div><button class="icon-btn" data-close aria-label="关闭"><span data-icon="close"></span></button></div><div class="list" data-dictionary-list></div><button class="btn primary" style="width:100%;margin-top:14px" data-close-after="已创建新的字典项并刷新候选">新增一项</button></section></div>
<div class="overlay dialog-wrap" id="account-dialog"><section class="dialog" role="alertdialog" aria-modal="true"><h2>申请注销账号？</h2><p>注销会使当前会话失效，并进入个人数据处理流程。建议先导出数据。</p><div class="action-row"><button class="btn grow" data-close>取消</button><button class="btn danger grow" data-close-after="注销申请已提交（原型演示）">继续注销</button></div></section></div>
<script src="prototype.js"></script></body></html>
