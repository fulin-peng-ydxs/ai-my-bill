<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F6F7FB"><title>收支报表 · 我的账单原型</title><script>try{const m=localStorage.getItem('bill-prototype-theme')||'system';document.documentElement.dataset.theme=m==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):m}catch(e){}</script><link rel="stylesheet" href="prototype.css"></head>
<body><div class="app"><main class="mobile-shell"><div class="page"><div data-page-content>
  <header class="page-head"><div><h1 class="page-title">收支报表</h1><p class="page-subtitle">本月 · 2026年8月</p></div><button class="icon-btn" data-open="filter-sheet" aria-label="筛选报表"><span data-icon="filter"></span></button></header>
  <div class="entry-type-segment report-scope" role="group" aria-label="报表范围"><button class="active" data-report-scope="overview" aria-pressed="true">总览</button><button class="expense" data-report-scope="expense" aria-pressed="false">支出</button><button data-report-scope="income" aria-pressed="false">收入</button></div>
  <div class="filter-summary"><span data-filter-summary-text>本月 · 全部账目</span><button class="btn text small" data-open="filter-sheet">筛选</button></div>
  <section class="balance-summary" aria-label="收支总览"><button data-drill data-dimension="type" data-value="income"><span>总收入</span><strong class="income-amount">+¥9,600.00</strong></button><button data-drill data-dimension="type" data-value="expense"><span>原始支出</span><strong class="expense-amount">−¥1,276.80</strong></button><button data-drill data-dimension="adjustment" data-value="refund"><span>退款/报销冲减</span><strong>+¥200.00</strong></button><button data-drill data-dimension="balance" data-value="all" class="balance-total"><span>本月结余</span><strong>+¥8,523.20</strong></button><div class="balance-formula">净支出 ¥1,076.80 = 原始支出 − 冲减；结余 = 收入 − 净支出</div></section>
  <div class="chip-row" data-report-dimensions aria-label="报表维度"></div>
  <section class="panel" data-report-view><div class="section-head"><div><h2 class="section-title" data-report-title>收支趋势</h2><div class="caption" data-report-caption>人民币 · 按业务时间</div></div><span class="tag">点击下钻</span></div><div class="chart" data-report-chart aria-label="当前维度图表"></div></section>
  <section class="panel"><div class="section-head"><h2 class="section-title" data-ranking-title>本月构成</h2><a class="btn text small" href="bill-details.html?source=reports&amp;dimension=scope&amp;value=all">查看全部</a></div><div data-report-ranking></div></section>
  <div class="prototype-note"><strong>真实切换</strong>总览、支出、收入拥有不同维度、色彩与下钻参数；收入为靛蓝，支出为铜橙，同时保留文字和正负号。</div>
</div></div><nav class="bottom-nav" aria-label="主导航"><a class="nav-item" href="expense-entry.html"><span data-icon="add"></span><span>记一笔</span></a><a class="nav-item active" href="reports.html"><span data-icon="chart"></span><span>报表</span></a><a class="nav-item" href="bill-details.html"><span data-icon="list"></span><span>明细</span></a><a class="nav-item" href="profile-settings.html"><span data-icon="user"></span><span>我的</span></a></nav></main></div>
<div class="overlay" id="filter-sheet"><section class="sheet" role="dialog" aria-modal="true"><div class="sheet-handle"></div><div class="sheet-head"><h2 class="sheet-title">筛选收支报表</h2><button class="icon-btn" data-close aria-label="关闭"><span data-icon="close"></span></button></div><div class="field"><label>时间范围</label><select class="control"><option>本月</option><option>上月</option><option>今年</option></select></div><div class="field"><label>账目类型</label><select class="control"><option>全部账目</option><option>仅支出</option><option>仅收入</option></select></div><div class="field"><label>分类或对象</label><select class="control"><option>全部分类与对象</option><option>餐饮</option><option>工资</option><option>示例科技有限公司</option></select></div><div class="field"><label>资金渠道</label><select class="control"><option>全部渠道</option><option>微信</option><option>银行卡</option></select></div><div class="action-row"><button class="btn grow" data-clear-filters>清除</button><button class="btn primary grow" data-apply-filters>应用筛选</button></div></section></div>
<script src="prototype.js"></script></body></html>
