<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F6F7FB"><title>报表 · 我的账单原型</title>
  <script>try{const m=localStorage.getItem('bill-prototype-theme')||'system';document.documentElement.dataset.theme=m==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):m}catch(e){}</script><link rel="stylesheet" href="prototype.css">
</head><body><div class="app"><main class="mobile-shell"><div class="page">
  <div data-page-content>
    <header class="page-head"><div><h1 class="page-title">消费报表</h1><p class="page-subtitle">本月 · 2026年8月</p></div><button class="icon-btn" type="button" data-open="filter-sheet" aria-label="筛选报表"><span data-icon="filter"></span></button></header>
    <div class="filter-summary"><span data-filter-summary-text>本月 · 全部条件</span><button class="btn text small" type="button" data-open="filter-sheet">筛选</button></div>
    <section class="receipt"><div class="receipt-row"><span>有效消费明细</span><strong class="receipt-amount">28 条</strong></div><div class="receipt-row"><span>日均消费</span><strong class="receipt-amount">¥38.46</strong></div><div class="receipt-row total"><span>本月实付</span><strong class="receipt-amount">¥1,076.80</strong></div></section>
    <div class="kpi-grid" style="margin-top:10px"><div class="kpi"><div class="kpi-label">较上月</div><div class="kpi-value" style="color:var(--success)">−8.2%</div><div class="kpi-note">少花 ¥96.30</div></div><div class="kpi"><div class="kpi-label">最高一天</div><div class="kpi-value">¥236.00</div><div class="kpi-note">8月9日</div></div></div>
    <div class="chip-row" style="margin:18px 0 12px" aria-label="报表维度"><button class="chip active" data-report-dimension="trend" aria-pressed="true">趋势</button><button class="chip" data-report-dimension="category" aria-pressed="false">分类</button><button class="chip" data-report-dimension="product" aria-pressed="false">商品</button><button class="chip" data-report-dimension="payment" aria-pressed="false">支付方式</button><button class="chip" data-report-dimension="channel" aria-pressed="false">购买渠道</button><button class="chip" data-report-dimension="location" aria-pressed="false">位置</button><button class="chip" data-report-dimension="habit" aria-pressed="false">习惯</button><button class="chip" data-report-dimension="price" aria-pressed="false">价格</button><button class="chip" data-report-dimension="frequency" aria-pressed="false">频次</button><button class="chip" data-report-dimension="quality" aria-pressed="false">数据质量</button></div>
    <section class="panel" data-report-view><div class="section-head"><div><h2 class="section-title" data-report-title>每日实付趋势</h2><div class="caption" data-report-caption>人民币 · 按消费时间</div></div><span class="tag">点击进入明细</span></div><div class="chart" data-report-chart aria-label="当前维度图表"></div></section>
    <section class="panel"><div class="section-head"><h2 class="section-title">商品消费排行</h2><a class="btn text small" href="bill-details.html?source=reports&amp;dimension=product&amp;value=all">查看全部</a></div><button class="rank-row" data-drill data-dimension="product" data-value="早餐包"><span class="rank-index">01</span><span>早餐包 <small class="muted">6 条</small></span><strong class="rank-value">¥168.00</strong></button><button class="rank-row" data-drill data-dimension="product" data-value="苹果"><span class="rank-index">02</span><span>苹果 <small class="muted">按千克统计</small></span><strong class="rank-value">¥93.60</strong></button><button class="rank-row" data-drill data-dimension="product" data-value="矿泉水"><span class="rank-index">03</span><span>矿泉水 <small class="muted">8 条</small></span><strong class="rank-value">¥28.50</strong></button></section>
    <div class="prototype-note"><strong>状态验证</strong>默认展示 ready；使用 `?state=loading|empty|error|permission` 验证互斥页面状态。维度切换会同步标题、单位、图形和下钻参数。</div>
  </div>
</div><nav class="bottom-nav" aria-label="主导航"><a class="nav-item" href="expense-entry.html"><span data-icon="add"></span><span>记一笔</span></a><a class="nav-item active" href="reports.html"><span data-icon="chart"></span><span>报表</span></a><a class="nav-item" href="bill-details.html"><span data-icon="list"></span><span>明细</span></a><a class="nav-item" href="profile-settings.html"><span data-icon="user"></span><span>我的</span></a></nav></main></div>
<div class="overlay" id="filter-sheet"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="filter-title"><div class="sheet-handle"></div><div class="sheet-head"><h2 id="filter-title" class="sheet-title">筛选报表</h2><button class="icon-btn" data-close aria-label="关闭"><span data-icon="close"></span></button></div><div class="field"><label>时间范围</label><select class="control"><option>本月</option><option>上月</option><option>今年</option></select></div><div class="field"><label>分类</label><select class="control"><option>全部分类</option><option>餐饮</option><option>交通</option></select></div><div class="field"><label>支付方式</label><select class="control"><option>全部支付方式</option><option>微信</option><option>支付宝</option></select></div><div class="field"><label>购买渠道</label><select class="control"><option>全部渠道</option><option>商超</option><option>便利店</option></select></div><div class="field"><label>购买位置</label><select class="control"><option>全部位置</option><option>家附近超市</option><option>未指定</option></select></div><div class="action-row"><button class="btn grow" data-clear-filters>清除</button><button class="btn primary grow" data-apply-filters>应用筛选</button></div></section></div>
<script src="prototype.js"></script></body></html>
