<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F5F5F7"><title>收支报表 · 我的账单原型</title><script>try{const m=localStorage.getItem('bill-prototype-theme')||'system';document.documentElement.dataset.theme=m==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):m}catch(e){}</script><link rel="stylesheet" href="prototype.css"></head>
<body data-page="reports"><div class="app"><main class="mobile-shell"><div class="page"><div data-page-content>
  <header class="page-head"><div><h1 class="page-title">收支报表</h1><p class="page-subtitle" data-report-date-caption>本月 · 2026年8月</p></div><button class="icon-btn" data-open="filter-sheet" aria-label="筛选报表"><span data-icon="filter"></span></button></header>
  <div class="entry-type-segment report-scope" role="group" aria-label="报表范围"><button class="active" data-report-scope="overview" aria-pressed="true">总览</button><button class="expense" data-report-scope="expense" aria-pressed="false">支出</button><button data-report-scope="income" aria-pressed="false">收入</button></div>
  <div class="filter-summary"><span data-filter-summary-text>本月 · 全部账目</span><button class="btn text small" data-open="filter-sheet">筛选</button></div>
  <section class="balance-summary" aria-label="收支总览" data-balance-summary><button data-drill data-drill-scope="overview" data-dimension="type" data-value="总收入"><span>总收入</span><strong class="income-amount">+¥9,600.00</strong></button><button data-drill data-drill-scope="overview" data-dimension="type" data-value="原始支出"><span>原始支出</span><strong class="expense-amount">−¥1,276.80</strong></button><button data-drill data-drill-scope="overview" data-dimension="adjustment" data-value="退款/报销冲减"><span>退款/报销冲减</span><strong>+¥200.00</strong></button><button data-drill data-drill-scope="overview" data-dimension="balance" data-value="本月结余" data-report-balance-drill class="balance-total"><span data-report-balance-label>本月结余</span><strong>+¥8,523.20</strong></button><div class="balance-formula">净支出 ¥1,076.80 = 原始支出 − 冲减；结余 = 收入 − 净支出</div></section>
  <div class="chip-row" data-report-dimensions aria-label="报表维度"></div>
  <div data-state-region="report"><section class="panel" data-report-view><div class="section-head"><div><h2 class="section-title" data-report-title>收支趋势</h2><div class="caption" data-report-caption>人民币 · 按业务时间</div></div><span class="tag">点击下钻</span></div><div class="chart" data-report-chart aria-label="当前维度图表"></div></section>
  <section class="panel"><div class="section-head"><h2 class="section-title" data-ranking-title>本月构成</h2><button class="btn text small" data-drill data-report-all data-dimension="all" data-value="全部收支明细">查看全部</button></div><div data-report-ranking></div></section></div>
  <div class="prototype-note"><strong>真实切换</strong>总览、支出、收入拥有不同维度、语义与下钻参数；收入固定红色、支出固定绿色，两种主题保持同一色值，同时保留文字和正负号。</div>
</div></div><nav class="bottom-nav" aria-label="主导航"><a class="nav-item" href="expense-entry.html"><span data-icon="add"></span><span>记一笔</span></a><a class="nav-item active" href="reports.html"><span data-icon="chart"></span><span>报表</span></a><a class="nav-item" href="bill-details.html"><span data-icon="list"></span><span>明细</span></a><a class="nav-item" href="profile-settings.html"><span data-icon="user"></span><span>我的</span></a></nav></main></div>
<div class="overlay" id="filter-sheet"><section class="sheet" role="dialog" aria-modal="true"><div class="sheet-handle"></div><div class="sheet-head"><h2 class="sheet-title">筛选收支报表</h2><button class="icon-btn" data-close aria-label="关闭"><span data-icon="close"></span></button></div><div class="field"><label>时间范围</label><select class="control" data-report-range data-filter-key="range"><option value="2026-08-01/2026-08-31">本月</option><option value="2026-07-01/2026-07-31">上月</option><option value="2026-01-01/2026-12-31">今年</option></select></div><div class="field"><label>账目范围</label><select class="control" data-report-filter-scope data-filter-key="scope"><option value="all">全部</option><option value="expense">支出</option><option value="income">收入</option></select></div><div class="field" data-filter-for="all expense income"><label>资金渠道</label><select class="control" data-filter-key="funding" data-funding-filter><option value="__all_funding_channels__">全部渠道</option></select></div><div class="field" data-filter-for="expense" hidden><label>支出分类</label><select class="control" data-filter-key="expenseCategory"><option>全部支出分类</option><option>餐饮</option><option>交通</option></select></div><div class="field" data-filter-for="expense" hidden><label>商品、购买渠道或地点</label><input class="control" data-filter-key="expenseQuery" placeholder="输入支出专属条件"></div><div class="field" data-filter-for="income" hidden><label>收入分类</label><select class="control" data-filter-key="incomeCategory"><option>全部收入分类</option><option>工资</option><option>兼职</option></select></div><div class="field" data-filter-for="income" hidden><label>付款方或收入名称</label><input class="control" data-filter-key="incomeQuery" placeholder="输入收入专属条件"></div><div class="action-row"><button class="btn grow" data-clear-filters>清除</button><button class="btn primary grow" data-apply-filters>应用筛选</button></div></section></div>
<script src="prototype.js"></script></body></html>
