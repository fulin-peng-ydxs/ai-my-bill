<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F6F7FB"><title>记一笔 · 我的账单原型</title>
  <script>try{const m=localStorage.getItem('bill-prototype-theme')||'system';document.documentElement.dataset.theme=m==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):m}catch(e){}</script><link rel="stylesheet" href="prototype.css">
</head><body><div class="app"><main class="mobile-shell" data-entry-shell data-money-scope>
  <div data-page-content><div class="page has-savebar"><header class="page-head"><div><h1 class="page-title">记一笔</h1><p class="page-subtitle">今天 · 8 月 13 日</p></div><button class="btn small" type="button" data-toast="已复制上一笔，消费时间更新为现在">复制上一笔</button></header>
    <div class="prototype-note"><strong>原型边界</strong>金额/数量精度、商品规范化和地图技术方案仍待 B2、B3、B5 确认；当前只验证字段、联动和失败降级。</div>
    <section class="panel"><div class="field"><label for="product">商品名称</label><input id="product" data-product data-required class="control" list="products" placeholder="搜索或输入新商品"><datalist id="products"><option value="矿泉水"></option><option value="苹果"></option><option value="早餐包"></option><option value="地铁"></option></datalist><span class="field-error">请先选择或输入商品</span><span class="field-help">租户内唯一；具体规范化规则待确认</span></div>
      <div class="input-row"><div class="field"><label for="category">分类</label><select id="category" class="control"><option>餐饮 / 零食</option><option>餐饮 / 正餐</option><option>交通 / 公共交通</option></select></div><div class="field"><label for="unit">单位</label><select id="unit" class="control"><option>瓶</option><option>个</option><option>千克</option><option>次</option></select></div></div>
      <div class="input-row"><div class="field"><label for="price">单位价格</label><div class="input-prefix"><span>¥</span><input id="price" data-price data-required data-nonnegative="true" class="control" inputmode="decimal" value="3.50"></div><span class="field-error">请输入不小于 0 的单价</span></div><div class="field"><label for="quantity">数量</label><input id="quantity" data-quantity data-required data-positive="true" class="control mono" inputmode="decimal" value="2"><span class="field-error">数量必须大于 0</span></div></div>
      <div class="field"><label for="paid">实付金额</label><div class="input-prefix"><span>¥</span><input id="paid" data-paid data-required data-nonnegative="true" class="control" inputmode="decimal" value="7.00"></div><span class="field-error">请输入不小于 0 的金额</span><span data-difference class="field-help">与计算金额一致</span></div>
      <div class="field"><label>支付方式</label><div class="chip-row" data-chip-group><button type="button" class="chip active" aria-pressed="true">微信</button><button type="button" class="chip" aria-pressed="false">支付宝</button><button type="button" class="chip" aria-pressed="false">银行卡</button><button type="button" class="chip" aria-pressed="false">现金</button><button type="button" class="chip" data-open="payment-sheet">管理</button></div></div>
      <div class="field"><label>购买渠道（是否必填待确认）</label><div class="chip-row" data-chip-group><button type="button" class="chip active" aria-pressed="true">未指定</button><button type="button" class="chip" aria-pressed="false">商超</button><button type="button" class="chip" aria-pressed="false">便利店</button><button type="button" class="chip" data-open="channel-sheet">管理</button></div></div>
      <div class="field"><label>购买位置（选填）</label><div class="chip-row" data-chip-group><button type="button" class="chip active" aria-pressed="true">未指定</button><button type="button" class="chip" aria-pressed="false">家附近超市</button><button type="button" class="chip" data-locate aria-pressed="false"><span data-icon="pin"></span>自动定位</button><button type="button" class="chip" data-open="location-sheet">地图选点</button></div></div>
      <div class="field"><label for="time">消费时间</label><input id="time" class="control" type="datetime-local" value="2026-08-13T12:30"></div><div class="field"><label for="note">备注（选填）</label><textarea id="note" class="control" placeholder="例如：便利店活动价"></textarea></div>
    </section><section class="receipt" style="margin-top:12px" aria-label="金额汇总"><div class="receipt-row"><span>计算金额</span><strong class="receipt-amount" data-calculated>¥7.00</strong></div><div class="receipt-row total"><span>本次实付</span><strong class="receipt-amount" data-total>¥7.00</strong></div></section></div>
    <div class="savebar"><button class="btn" type="button" data-save-entry="continue">保存并继续</button><button class="btn primary" type="button" data-save-entry="save">保存账单</button></div>
  </div>
  <nav class="bottom-nav" aria-label="主导航"><a class="nav-item active" href="expense-entry.html"><span data-icon="add"></span><span>记一笔</span></a><a class="nav-item" href="reports.html"><span data-icon="chart"></span><span>报表</span></a><a class="nav-item" href="bill-details.html"><span data-icon="list"></span><span>明细</span></a><a class="nav-item" href="profile-settings.html"><span data-icon="user"></span><span>我的</span></a></nav>
</main></div>
<div class="overlay" id="payment-sheet"><section class="sheet" role="dialog" aria-modal="true"><div class="sheet-handle"></div><div class="sheet-head"><h2 class="sheet-title">支付方式</h2><button class="icon-btn" data-close aria-label="关闭"><span data-icon="close"></span></button></div><div class="setting-list"><button class="setting-row" data-close-after="已新增并选中“公交卡”"><span>新增支付方式</span><span class="setting-value">新增</span></button><button class="setting-row" data-close-after="已打开排序与停用"><span>排序与停用</span><span class="setting-value">4 项</span></button></div></section></div>
<div class="overlay" id="channel-sheet"><section class="sheet" role="dialog" aria-modal="true"><div class="sheet-handle"></div><div class="sheet-head"><h2 class="sheet-title">购买渠道</h2><button class="icon-btn" data-close aria-label="关闭"><span data-icon="close"></span></button></div><div class="setting-list"><button class="setting-row" data-close-after="已新增并选中“菜市场”"><span>新增购买渠道</span><span class="setting-value">新增</span></button><button class="setting-row" data-close-after="已打开排序与停用"><span>排序与停用</span><span class="setting-value">4 项</span></button></div></section></div>
<div class="overlay" id="location-sheet"><section class="sheet" role="dialog" aria-modal="true"><div class="sheet-handle"></div><div class="sheet-head"><div><h2 class="sheet-title">选择购买位置</h2><div class="caption">业务交互线框 · 不代表地图供应商</div></div><button class="icon-btn" data-close aria-label="关闭"><span data-icon="close"></span></button></div><div class="map-placeholder"><span data-icon="pin"></span><strong data-map-result>尚未选点</strong><span>坐标系与地址解析等待 B5</span></div><div class="chip-row"><button class="chip" data-map-choice>万达广场示例点</button><button class="chip" data-map-choice>公司楼下示例点</button></div><div class="field" style="margin-top:14px"><label>常用地点名称</label><input class="control" placeholder="例如：家附近超市"></div><div class="action-row"><button class="btn grow" data-close>取消</button><button class="btn primary grow" data-close-after="位置已回填；是否保存为常用地点由用户选择">确认位置</button></div></section></div>
<script src="prototype.js"></script></body></html>
