# T26 单机运行早期告警规则。只使用无租户、无账目内容的有限基数指标；阈值需在 T29 目标主机压测后复核。
groups:
  - name: my-bill-runtime
    rules:
      - alert: MyBillUnavailable
        expr: up{job="my-bill"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 我的账单服务连续两分钟不可采集
      - alert: MyBillHttpServerErrors
        expr: sum(rate(http_server_requests_seconds_count{application="my-bill-server",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{application="my-bill-server"}[5m])), 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 我的账单服务端错误比例持续高于 5%
      - alert: MyBillDatabasePoolPending
        expr: hikaricp_connections_pending{application="my-bill-server"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 数据库连接池持续存在等待请求
      - alert: MyBillJobFailures
        expr: increase(my_bill_jobs_executed_total{application="my-bill-server",outcome=~"failed|lease_lost"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: 后台任务出现最终失败或租约丢失
      - alert: MyBillDiskCapacityLow
        expr: disk_free_bytes{application="my-bill-server"} / disk_total_bytes{application="my-bill-server"} < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 应用数据盘可用容量低于 15%
