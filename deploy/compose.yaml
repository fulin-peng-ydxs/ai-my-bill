name: my-bill

services:
  db:
    image: postgres:16.14-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-my_bill}
      POSTGRES_USER: my_bill_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_bill_admin -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  provision:
    image: postgres:16.14-bookworm
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-my_bill}
      MY_BILL_POSTGRES_HOST: db
      MY_BILL_POSTGRES_ADMIN_USERNAME: my_bill_admin
      MY_BILL_POSTGRES_ADMIN_PASSWORD_FILE: /run/secrets/postgres_admin_password
      MY_BILL_MIGRATION_DB_PASSWORD_FILE: /run/secrets/migration_db_password
      MY_BILL_APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
    secrets:
      - postgres_admin_password
      - migration_db_password
      - app_db_password
    volumes:
      - ./postgres/001_roles.sql:/opt/my-bill/postgres/001_roles.sql:ro
      - ./scripts/run-roles.sh:/usr/local/bin/run-roles:ro
    entrypoint: ["/usr/local/bin/run-roles"]
    networks:
      - database

  migrate:
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: migrate
    restart: "no"
    depends_on:
      provision:
        condition: service_completed_successfully
    environment:
      MY_BILL_MIGRATION_DB_URL: ${MY_BILL_MIGRATION_DB_URL:-jdbc:postgresql://db:5432/my_bill}
      MY_BILL_MIGRATION_DB_USERNAME: ${MY_BILL_MIGRATION_DB_USERNAME:-my_bill_migration}
      MY_BILL_MIGRATION_DB_PASSWORD_FILE: /run/secrets/migration_db_password
    secrets:
      - migration_db_password
    networks:
      - database

  app:
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MY_BILL_APP_DB_URL: ${MY_BILL_APP_DB_URL:-jdbc:postgresql://db:5432/my_bill}
      MY_BILL_APP_DB_USERNAME: ${MY_BILL_APP_DB_USERNAME:-my_bill_app}
      MY_BILL_APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
      MY_BILL_AUTH_RATE_LIMIT_PEPPER_FILE: /run/secrets/auth_rate_limit_pepper
      MY_BILL_AUTH_MAX_SOURCE_LOGIN_FAILURES: ${MY_BILL_AUTH_MAX_SOURCE_LOGIN_FAILURES:-50}
      MY_BILL_SERVER_PORT: ${MY_BILL_SERVER_PORT:-8080}
      MY_BILL_DB_POOL_MAX_SIZE: ${MY_BILL_DB_POOL_MAX_SIZE:-5}
      MY_BILL_DB_POOL_MIN_IDLE: ${MY_BILL_DB_POOL_MIN_IDLE:-1}
      MY_BILL_DB_CONNECTION_TIMEOUT_MS: ${MY_BILL_DB_CONNECTION_TIMEOUT_MS:-5000}
      MY_BILL_EXPORT_DIRECTORY: ${MY_BILL_EXPORT_DIRECTORY:-/var/lib/my-bill/exports}
      MY_BILL_EXPORT_RETENTION: ${MY_BILL_EXPORT_RETENTION:-PT24H}
    secrets:
      - app_db_password
      - auth_rate_limit_pepper
    volumes:
      - export_data:/var/lib/my-bill/exports
    networks:
      - database
      - application
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:$${MY_BILL_SERVER_PORT}/api/v1/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12

networks:
  database:
    internal: true
  application:

volumes:
  postgres_data:
  export_data:

secrets:
  postgres_admin_password:
    file: ${MY_BILL_POSTGRES_ADMIN_PASSWORD_HOST_FILE:?set PostgreSQL bootstrap password file}
  migration_db_password:
    file: ${MY_BILL_MIGRATION_DB_PASSWORD_HOST_FILE:?set migration password file}
  app_db_password:
    file: ${MY_BILL_APP_DB_PASSWORD_HOST_FILE:?set app password file}
  auth_rate_limit_pepper:
    file: ${MY_BILL_AUTH_RATE_LIMIT_PEPPER_HOST_FILE:?set auth rate limit pepper file}
