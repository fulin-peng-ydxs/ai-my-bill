# 与 compose.yaml 合用；只发布指定内网 IP 的 HTTPS，数据库和应用不发布端口。
x-runtime: &runtime
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  security_opt:
    - no-new-privileges:true

services:
  db:
    <<: *runtime
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200
  provision:
    mem_limit: 256m
    cpus: 0.5
  migrate:
    mem_limit: 512m
    cpus: 0.5
  app:
    <<: *runtime
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    environment:
      JAVA_OPTS: -Xms128m -Xmx512m -XX:MaxDirectMemorySize=128m
      MY_BILL_JOB_POLL_DELAY_MS: ${MY_BILL_JOB_POLL_DELAY_MS:-5000}
      MY_BILL_JOB_MAX_TASKS_PER_POLL: ${MY_BILL_JOB_MAX_TASKS_PER_POLL:-20}
  proxy:
    <<: *runtime
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    depends_on:
      app:
        condition: service_healthy
    environment:
      MY_BILL_ALLOWED_CIDRS: ${MY_BILL_ALLOWED_CIDRS:?set explicitly allowed client CIDRs}
      MY_BILL_SERVER_PORT: ${MY_BILL_SERVER_PORT:-8080}
    ports:
      - "${MY_BILL_BIND_IP:?set private IPv4}:${MY_BILL_HTTPS_PORT:-18443}:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MY_BILL_WEB_DIST:?set verified release dist path}:/srv:ro
      # 挂载目录，使续期后的原子替换能被 reload 读取；只含叶证书/私钥，禁止放入 CA 私钥。
      - ${MY_BILL_TLS_DIRECTORY:?set leaf certificate directory}:/etc/my-bill/tls:ro
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0700,size=16m
      - /config:uid=10001,gid=10001,mode=0700,size=16m
    networks:
      - application
