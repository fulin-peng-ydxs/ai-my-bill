spring:
  application:
    name: my-bill-server
  datasource:
    url: jdbc:postgresql://${MY_BILL_DB_HOST:127.0.0.1}:${MY_BILL_DB_PORT:54329}/${MY_BILL_DB_NAME:my_bill_dev}
    username: ${MY_BILL_DB_APP_USER:my_bill_app}
    password: ${MY_BILL_DB_APP_PASSWORD:}
    hikari:
      maximum-pool-size: ${MY_BILL_DB_POOL_MAX_SIZE:5}
      minimum-idle: ${MY_BILL_DB_POOL_MIN_IDLE:1}
      connection-timeout: ${MY_BILL_DB_CONNECTION_TIMEOUT_MS:5000}
  flyway:
    enabled: true
    url: ${MY_BILL_DB_MIGRATION_URL:${spring.datasource.url}}
    user: ${MY_BILL_DB_MIGRATION_USER:my_bill_migration}
    password: ${MY_BILL_DB_MIGRATION_PASSWORD:}
    validate-migration-naming: true
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-handlers-package: com.mybill.shared.persistence
  configuration:
    map-underscore-to-camel-case: false
  global-config:
    banner: false

server:
  port: ${MY_BILL_SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      base-path: /api/v1
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,1s,3s

my-bill:
  schema:
    validation-enabled: false
    expected-version: "012"
  auth:
    session-cookie-name: MY_BILL_SESSION
    session-duration: PT12H
    secure-cookie: false
    bcrypt-strength: 12
    rate-limit-window: PT15M
    max-login-failures: 5
    max-source-login-failures: ${MY_BILL_AUTH_MAX_SOURCE_LOGIN_FAILURES:50}
    login-lock-duration: PT15M
    rate-limit-pepper: ${MY_BILL_AUTH_RATE_LIMIT_PEPPER:my-bill-local-rate-limit-pepper}
  jobs:
    lease-duration: PT30S
    poll-delay-ms: ${MY_BILL_JOB_POLL_DELAY_MS:5000}
    max-tasks-per-poll: ${MY_BILL_JOB_MAX_TASKS_PER_POLL:20}
  export:
    directory: ${MY_BILL_EXPORT_DIRECTORY:.local/exports}
    retention: ${MY_BILL_EXPORT_RETENTION:PT24H}
