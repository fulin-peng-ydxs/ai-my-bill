spring:
  application:
    name: my-bill-server
  datasource:
    url: jdbc:postgresql://${MY_BILL_DB_HOST:127.0.0.1}:${MY_BILL_DB_PORT:54329}/${MY_BILL_DB_NAME:my_bill_dev}
    username: ${MY_BILL_DB_USER:my_bill_dev}
    password: ${MY_BILL_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
  jackson:
    default-property-inclusion: non_null

server:
  port: ${MY_BILL_SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      base-path: /api/v1
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
