spring:
  application:
    name: my-bill-server
  datasource:
    url: jdbc:postgresql://${MY_BILL_DB_HOST:127.0.0.1}:${MY_BILL_DB_PORT:54329}/${MY_BILL_DB_NAME:my_bill_dev}
    username: ${MY_BILL_DB_APP_USER:my_bill_app}
    password: ${MY_BILL_DB_APP_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    enabled: true
    url: ${MY_BILL_DB_MIGRATION_URL:${spring.datasource.url}}
    user: ${MY_BILL_DB_MIGRATION_USER:my_bill_migration}
    password: ${MY_BILL_DB_MIGRATION_PASSWORD:}
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

server:
  port: ${MY_BILL_SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      base-path: /api/v1
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

my-bill:
  schema:
    validation-enabled: false
    expected-version: "010"
  auth:
    session-cookie-name: MY_BILL_SESSION
    session-duration: PT12H
    secure-cookie: false
    bcrypt-strength: 12
    rate-limit-window: PT15M
    max-login-failures: 5
    login-lock-duration: PT15M
    rate-limit-pepper: ${MY_BILL_AUTH_RATE_LIMIT_PEPPER:my-bill-local-rate-limit-pepper}
  jobs:
    lease-duration: PT30S
