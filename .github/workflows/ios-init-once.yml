name: ios-init-once-20261125
on:
  push:
    tags:
      - 'ios-diag/once-20261125-130046'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: xcode-27
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: One controlled native comparison
        run: python3 -B scripts/diagnostics/ios-init-once.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-init-once-${{ github.run_id }}
          path: .local/ios/tmp/ai-agent/ios-once-diagnostic
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
