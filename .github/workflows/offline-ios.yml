name: offline-ios

on:
  push:
    paths:
      - 'app/**'
      - 'DESIGN.md'
      - 'scripts/ios-app.sh'
      - 'scripts/ios-app.mjs'
      - 'scripts/lib/ios-*.mjs'
      - 'scripts/lib/ios-app-full.sh'
      - 'scripts/tests/ios-debug.test.mjs'
      - 'scripts/tests/ios-verification.test.mjs'
      - 'scripts/fixtures/dictionary-touch.py'
      - 'scripts/normalize-capacitor-spm.mjs'
      - 'scripts/verify-ios-resources.mjs'
      - 'scripts/ios-storage-policy.mjs'
      - 'scripts/tests/ios-resources.test.mjs'
      - 'scripts/toolchain.sh'
      - '.nvmrc'
      - 'package.json'
      - '.github/workflows/offline-ios.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'DESIGN.md'
      - 'scripts/ios-app.sh'
      - 'scripts/ios-app.mjs'
      - 'scripts/lib/ios-*.mjs'
      - 'scripts/lib/ios-app-full.sh'
      - 'scripts/tests/ios-debug.test.mjs'
      - 'scripts/tests/ios-verification.test.mjs'
      - 'scripts/fixtures/dictionary-touch.py'
      - 'scripts/normalize-capacitor-spm.mjs'
      - 'scripts/verify-ios-resources.mjs'
      - 'scripts/ios-storage-policy.mjs'
      - 'scripts/tests/ios-resources.test.mjs'
      - 'scripts/toolchain.sh'
      - '.nvmrc'
      - 'package.json'
      - '.github/workflows/offline-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-common:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci --ignore-scripts
      # 共享入口从前置检查累计整轮预算，并对每个阶段计时；job 的 10 分钟是外层汇总预算。
      - run: npm run check:app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-ios-common-${{ github.sha }}
          path: |
            .local/ios/tmp/ai-agent/ios-invocation-*/*.json
            .local/ios/tmp/ai-agent/ios-command-*/*.json
            .local/ios/tmp/ai-agent/native-*/*.log
            .local/ios/tmp/ai-agent/native-*/*.json
          retention-days: 7
          if-no-files-found: warn

  native-simulator:
    needs: app-common
    # 官方 Xcode 27 preview 镜像；实际 SDK/runtime 不符时脚本失败，不能降级通过。
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci --ignore-scripts
      # ios-build 的前置检查包含在整轮预算；阶段预算仍为构建 10 分钟/检查 5 分钟。
      - run: npm run build:ios-app
      - id: ios-session
        shell: bash
        run: |
          output="$(npm run debug:ios-app -- create)"
          printf '%s\n' "$output"
          session="$(printf '%s\n' "$output" | sed -n 's/^SESSION=//p')"
          test -n "$session"
          printf 'session=%s\n' "$session" >> "$GITHUB_OUTPUT"
      - id: native-local
        # 包含 T8 生命周期和 T9 搜索取消、Unicode 输入边界、查询/分页/返回及 T10 原子统计快照回归；原生套件自动发现同一 SQL/迁移场景。
        run: |
          npm run debug:ios-app -- check --check app-tests | tee .local/ios/tmp/ai-agent/ci-native-local.log
          proof="$(sed -n 's/^EVIDENCE=//p' .local/ios/tmp/ai-agent/ci-native-local.log)"
          test -n "$proof"
          printf 'evidence=%s\n' "$proof" >> "$GITHUB_OUTPUT"
      - env:
          IOS_DEBUG_SESSION: ${{ steps.ios-session.outputs.session }}
          IOS_LOCAL_EVIDENCE: ${{ steps.native-local.outputs.evidence }}
        run: npm run check:ios-app:simulator -- --session "$IOS_DEBUG_SESSION" --from "$IOS_LOCAL_EVIDENCE"
      - id: touch-local
        run: |
          npm run debug:ios-app -- check --check app-tests --file src/views/me/dictionaries/DictionaryDetailView.spec.ts | tee .local/ios/tmp/ai-agent/ci-touch-local.log
          proof="$(sed -n 's/^EVIDENCE=//p' .local/ios/tmp/ai-agent/ci-touch-local.log)"
          test -n "$proof"
          printf 'evidence=%s\n' "$proof" >> "$GITHUB_OUTPUT"
      - env:
          IOS_DEBUG_SESSION: ${{ steps.ios-session.outputs.session }}
          IOS_LOCAL_EVIDENCE: ${{ steps.touch-local.outputs.evidence }}
        # 连续执行 T6 收支、T7 个人状态、T8 生命周期及 T9 查询/返回及 test34/35 的真实键盘/粘贴；追加 T10 总览/时间/下钻/比较；共用局部用例与 SQLite 回读。
        run: npm run check:ios-app:touch -- --session "$IOS_DEBUG_SESSION" --from "$IOS_LOCAL_EVIDENCE"
      - if: always() && steps.ios-session.outputs.session != ''
        env:
          IOS_DEBUG_SESSION: ${{ steps.ios-session.outputs.session }}
        run: npm run debug:ios-app -- close --session "$IOS_DEBUG_SESSION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-ios-native-${{ github.sha }}
          path: |
            .local/ios/tmp/ai-agent/ios-invocation-*/*.json
            .local/ios/tmp/ai-agent/ios-command-*/*.json
            .local/ios/tmp/ai-agent/ios-verification-state.json
            .local/ios/tmp/ai-agent/ios-full-*/*.json
            .local/ios/tmp/ai-agent/ios-check-*/*.json
            .local/ios/tmp/ai-agent/ios-check-*/*.log
            .local/ios/tmp/ai-agent/ios-debug-*/run-*/*.json
            .local/ios/tmp/ai-agent/ios-debug-*/run-*/*.log
            .local/ios/tmp/ai-agent/ios-debug-*/run-*/*.xcresult
            .local/ios/tmp/ai-agent/native-*/*.log
            .local/ios/tmp/ai-agent/native-*/*.json
            .local/ios/tmp/ai-agent/native-*/*-receipt.txt
            .local/ios/tmp/ai-agent/native-*/*.xcresult
          retention-days: 7
          if-no-files-found: error
