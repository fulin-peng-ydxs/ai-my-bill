name: offline-ios

on:
  push:
    paths:
      - 'app/**'
      - 'DESIGN.md'
      - 'scripts/ios-app.sh'
      - 'scripts/ios-app.mjs'
      - 'scripts/lib/ios-*.mjs'
      - 'scripts/lib/ios-app-full.sh'
      - 'scripts/tests/ios-debug.test.mjs'
      - 'scripts/tests/ios-verification.test.mjs'
      - 'scripts/fixtures/dictionary-touch.py'
      - 'scripts/fixtures/ios-ui-baseline.py'
      - 'scripts/tests/ios-cache.test.mjs'
      - 'scripts/normalize-capacitor-spm.mjs'
      - 'scripts/verify-ios-resources.mjs'
      - 'scripts/ios-storage-policy.mjs'
      - 'scripts/tests/ios-resources.test.mjs'
      - 'scripts/toolchain.sh'
      - '.nvmrc'
      - 'package.json'
      - '.github/workflows/offline-ios.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'DESIGN.md'
      - 'scripts/ios-app.sh'
      - 'scripts/ios-app.mjs'
      - 'scripts/lib/ios-*.mjs'
      - 'scripts/lib/ios-app-full.sh'
      - 'scripts/tests/ios-debug.test.mjs'
      - 'scripts/tests/ios-verification.test.mjs'
      - 'scripts/fixtures/dictionary-touch.py'
      - 'scripts/fixtures/ios-ui-baseline.py'
      - 'scripts/tests/ios-cache.test.mjs'
      - 'scripts/normalize-capacitor-spm.mjs'
      - 'scripts/verify-ios-resources.mjs'
      - 'scripts/ios-storage-policy.mjs'
      - 'scripts/tests/ios-resources.test.mjs'
      - 'scripts/toolchain.sh'
      - '.nvmrc'
      - 'package.json'
      - '.github/workflows/offline-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      common: ${{ steps.scope.outputs.common }}
      native: ${{ steps.scope.outputs.native }}
      baseline: ${{ steps.scope.outputs.baseline }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/lib/ios-ci.mjs

  app-common:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci --ignore-scripts
      # native:sync 先从锁定 CLI 模板准备 SPM；干净检出不依赖本机生成目录。
      # 同一 script-tests 覆盖真实 sync、双向重命名分流及卸载前回执拒绝；job 超时仍是外层限制。
      - name: App 与脚本门禁（含干净检出 SPM、缓存隔离、安装保护及 T10 强断言）
        if: needs.scope.outputs.common == 'app'
        run: npm run check:app
      - name: 验证工具局部回归
        if: needs.scope.outputs.common == 'scripts'
        run: npm run debug:ios-app -- check --check script-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-ios-common-${{ github.sha }}
          path: |
            .local/ios/tmp/ai-agent/ios-invocation-*/*.json
            .local/ios/tmp/ai-agent/ios-command-*/*.json
            .local/ios/tmp/ai-agent/ios-check-*/*.json
            .local/ios/tmp/ai-agent/ios-check-*/*.log
            .local/ios/tmp/ai-agent/native-*/*.log
            .local/ios/tmp/ai-agent/native-*/*.json
          retention-days: 7
          if-no-files-found: warn

  script-macos:
    needs: [scope, app-common]
    if: needs.scope.outputs.native == 'false'
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci --ignore-scripts
      # 覆盖 macOS 条件分支的受控 CLI 和卸载前拒绝；SPM 场景只同步资源，不编译 App、不启动模拟器。
      - run: npm run debug:ios-app -- check --check script-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-ios-scripts-macos-${{ github.sha }}
          path: |
            .local/ios/tmp/ai-agent/ios-invocation-*/*.json
            .local/ios/tmp/ai-agent/ios-check-*/*.json
            .local/ios/tmp/ai-agent/ios-check-*/*.log
          retention-days: 7
          if-no-files-found: error

  native-simulator:
    needs: [scope, app-common]
    if: needs.scope.outputs.native == 'true'
    # 官方 Xcode 27 preview 镜像；实际 SDK/runtime 不符时脚本失败，不能降级通过。
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci --ignore-scripts
      # 冷候选工程检查保持；局部缓存/安装/夹具复用回归由 common 的同一脚本测试覆盖，
      # 不为命中检查重复完整验收。前置检查计入整轮预算；构建/检查仍为 10/5 分钟。
      - run: npm run build:ios-app
      - id: ios-session
        shell: bash
        run: |
          output="$(npm run debug:ios-app -- create)"
          printf '%s\n' "$output"
          session="$(printf '%s\n' "$output" | sed -n 's/^SESSION=//p')"
          test -n "$session"
          printf 'session=%s\n' "$session" >> "$GITHUB_OUTPUT"
      - id: native-local
        # 自动发现 T10 跨午夜总览下钻、固定范围的日/月/年界执行及五粒度慢响应/失败/重试回归。
        # 包含 T8 生命周期和 T9 搜索取消、Unicode 输入边界、查询/分页/返回；原生套件共用 SQL/迁移场景。
        run: |
          npm run debug:ios-app -- check --check app-tests | tee .local/ios/tmp/ai-agent/ci-native-local.log
          proof="$(sed -n 's/^EVIDENCE=//p' .local/ios/tmp/ai-agent/ci-native-local.log)"
          test -n "$proof"
          printf 'evidence=%s\n' "$proof" >> "$GITHUB_OUTPUT"
      - env:
          IOS_DEBUG_SESSION: ${{ steps.ios-session.outputs.session }}
          IOS_LOCAL_EVIDENCE: ${{ steps.native-local.outputs.evidence }}
        run: npm run check:ios-app:simulator -- --session "$IOS_DEBUG_SESSION" --from "$IOS_LOCAL_EVIDENCE"
      - id: touch-local
        run: |
          npm run debug:ios-app -- check --check app-tests --file src/views/me/dictionaries/DictionaryDetailView.spec.ts | tee .local/ios/tmp/ai-agent/ci-touch-local.log
          proof="$(sed -n 's/^EVIDENCE=//p' .local/ios/tmp/ai-agent/ci-touch-local.log)"
          test -n "$proof"
          printf 'evidence=%s\n' "$proof" >> "$GITHUB_OUTPUT"
      - env:
          IOS_DEBUG_SESSION: ${{ steps.ios-session.outputs.session }}
          IOS_LOCAL_EVIDENCE: ${{ steps.touch-local.outputs.evidence }}
        # T10 共用绝对日期 JSON 夹具及已校验词典序；原生筛选固定范围，断言等待具体时段及下钻可用。
        # 连续执行 T6—T9 的既有范围；不为局部调试重复全套。完整 touch 共用夹具与 SQLite 回读。
        run: npm run check:ios-app:touch -- --session "$IOS_DEBUG_SESSION" --from "$IOS_LOCAL_EVIDENCE"
      - if: always() && steps.ios-session.outputs.session != ''
        env:
          IOS_DEBUG_SESSION: ${{ steps.ios-session.outputs.session }}
        run: npm run debug:ios-app -- close --session "$IOS_DEBUG_SESSION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-ios-native-${{ github.sha }}
          path: |
            .local/ios/tmp/ai-agent/ios-invocation-*/*.json
            .local/ios/tmp/ai-agent/ios-command-*/*.json
            .local/ios/tmp/ai-agent/ios-verification-state.json
            .local/ios/tmp/ai-agent/ios-full-*/*.json
            .local/ios/tmp/ai-agent/ios-check-*/*.json
            .local/ios/tmp/ai-agent/ios-check-*/*.log
            .local/ios/tmp/ai-agent/ios-debug-*/run-*/*.json
            .local/ios/tmp/ai-agent/ios-debug-*/run-*/*.log
            .local/ios/tmp/ai-agent/ios-debug-*/run-*/*.xcresult
            .local/ios/tmp/ai-agent/ios-debug-*/layer-*.json
            .local/ios/tmp/ai-agent/native-*/*.log
            .local/ios/tmp/ai-agent/native-*/*.json
            .local/ios/tmp/ai-agent/native-*/*-receipt.txt
            .local/ios/tmp/ai-agent/native-*/*.xcresult
          retention-days: 7
          if-no-files-found: error

  # 供后续提交读取的版本化质量标记；失败、取消或跳过必需 job 时绝不产生成功标记。
  app-baseline-v1:
    needs: [scope, app-common, script-macos, native-simulator]
    if: >-
      always() && needs.scope.result == 'success' && needs['app-common'].result == 'success' &&
      ((needs.scope.outputs.native == 'true' && needs['native-simulator'].result == 'success') ||
       (needs.scope.outputs.native == 'false' && needs.scope.outputs.baseline == 'true' &&
        needs['script-macos'].result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo 'App baseline verified for this commit'
