name: offline-ios

# PR 常规始终含固定 actionlint/Gitleaks；模拟器及 local-gate 只在本地，最终集中验收。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    tags:
      - 'ios-ci/scripts/**'
      - 'ios-ci/common/**'
      - 'ios-ci/change/**'
      - 'ios-ci/dependency-audit/**'
  workflow_dispatch:
    inputs:
      verification:
        description: '远端常规检查：scripts=工具；common=工程/SDK编译/审计；change=按变更；dependency-audit=审计。模拟器与final使用本地入口。'
        required: true
        default: scripts
        type: choice
        options:
          - scripts
          - common
          - change
          - dependency-audit
      base_revision:
        description: 'change 必填：变更起点完整 SHA'
        type: string
  schedule:
    # 05:17 Asia/Shanghai; GitHub may queue this default-branch audit.
    - cron: '17 21 * * *'

permissions:
  contents: read

concurrency:
  group: offline-ios-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.verification || 'tag' }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      directory: ${{ steps.plan.outputs.directory }}
      profile: ${{ steps.plan.outputs.profile }}
      artifact: ${{ steps.plan.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Resolve requested profile before dependency preparation
        id: request
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { requestedScope } from './scripts/lib/ios-ci.mjs'
          const { profile } = requestedScope(process.env.GITHUB_EVENT_NAME,
            JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')))
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `profile=${profile}\n`)
          NODE
      # AST 规划、执行和对账使用相同锁定解析器；定时/显式审计仍只读取锁文件。
      - name: Prepare locked planning dependencies
        if: steps.request.outputs.profile != 'dependency-audit'
        run: npm --prefix app ci --ignore-scripts
      - name: Validate registry and plan required suites
        id: plan
        run: |
          npm run ci:ios-app -- docs
          npm run ci:ios-app -- prepare
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: ${{ steps.plan.outputs.directory }}/ci-plan.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  checks:
    needs: plan
    env:
      DEVELOPER_DIR: ${{ matrix.group == 'macos' && '/Applications/Xcode_27.app/Contents/Developer' || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # 同组顺序执行常规检查；统一进程清理保留主失败及补偿失败，不启动模拟器。
    # 正式执行/清理预算不变；受控回归仅独立缩短清理宽限，等待就绪后取消。
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Verify pinned Apple toolchain
        if: matrix.group == 'macos'
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - if: needs.plan.outputs.profile != 'dependency-audit'
        run: npm --prefix app ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: ${{ needs.plan.outputs.directory }}
      - env:
          IOS_CI_RESULTS: ${{ needs.plan.outputs.directory }}
          IOS_CI_GROUP: ${{ matrix.group }}
        run: |
          npm run ci:ios-app -- run --results "$IOS_CI_RESULTS" --group "$IOS_CI_GROUP"
      - name: Preserve this attempt independently
        if: always()
        env:
          IOS_CI_RESULTS: ${{ needs.plan.outputs.directory }}
          IOS_CI_GROUP: ${{ matrix.group }}
          IOS_CI_ATTEMPT: ${{ github.run_attempt }}
        run: npm run ci:ios-app -- archive --results "$IOS_CI_RESULTS" --group "$IOS_CI_GROUP" --attempt "$IOS_CI_ATTEMPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ci-executed-${{ matrix.group }}-${{ github.run_attempt }}
          path: .local/ios/tmp/ai-agent/ios-ci-archives/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-diagnostics-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            .local/ios/tmp/ai-agent/ios-invocation-*/*.json
            .local/ios/tmp/ai-agent/ios-verification-state.json
            .local/ios/tmp/ai-agent/ios-process-*/*.json
            .local/ios/tmp/ai-agent/ios-host-processes-*.jsonl
            .local/ios/tmp/ai-agent/ios-stall-sample-*.txt
            .local/ios/tmp/ai-agent/ios-check-*/check.log
            .local/ios/tmp/ai-agent/ios-check-*/result.json
            .local/ios/tmp/ai-agent/ios-debug-*/run-*/*.xcresult
            .local/ios/tmp/ai-agent/ios-debug-*/boot-*.log
            .local/ios/tmp/ai-agent/ios-debug-*/boot-*.json
            .local/ios/tmp/ai-agent/native-*/*.xcresult
            .local/ios/tmp/ai-agent/native-*/*.log
            .local/ios/tmp/ai-agent/native-*/app-tests.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

      # runner 临时宿主上的系统日志只作故障取证，不充当启动/测试成功证据。
      - name: Preserve simulator host diagnostics
        if: failure() && matrix.group == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ios-host-diagnostics-${{ github.run_attempt }}
          path: |
            ~/Library/Logs/CoreSimulator/CoreSimulator.log
            ~/Library/Logs/DiagnosticReports/simctl*.ips
            ~/Library/Logs/DiagnosticReports/node*.ips
            ~/Library/Logs/DiagnosticReports/sample*.ips
            ~/Library/Logs/DiagnosticReports/CoreSimulatorService*.ips
          retention-days: 7
          if-no-files-found: warn

  local_evidence:
    name: Verify PR local receipt
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Read-only bootstrap/common consumer; protected status is separately published from trusted base code.
      - env:
          IOS_LOCAL_EVIDENCE_SIGNERS: ${{ vars.IOS_LOCAL_EVIDENCE_SIGNERS }}
          IOS_EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha }}
          IOS_EVIDENCE_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ios-evidence.mjs

  result:
    name: ${{ github.event_name == 'pull_request' && 'CI common result' || format('CI suite {0} result', needs.plan.outputs.profile || github.event.inputs.verification || 'request') }}
    if: always()
    needs: [plan, checks, local_evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      complete: ${{ steps.result.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Prepare locked reconciliation dependencies
        if: needs.plan.result == 'success' && needs.plan.outputs.profile != 'dependency-audit'
        run: npm --prefix app ci --ignore-scripts
      - uses: actions/download-artifact@v4
        if: needs.plan.result == 'success'
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: ${{ needs.plan.outputs.directory }}
      - uses: actions/download-artifact@v4
        if: needs.plan.result == 'success'
        with:
          pattern: ios-ci-executed-*
          path: ${{ needs.plan.outputs.directory }}/archives
          merge-multiple: true
      # 同一对账器核验必需阶段/构建成功记录及 TAP 的 TODO、平台跳过，不只检查退出码。
      # 覆盖率拒绝空采集；规模重验设备/计时/RSS 窗口。签名授权仍只在可信手动入口核验。
      # 完整规模先归集结束阶段；共享表单/抽屉按跨页分流，非正时间窗拒绝。
      # 各组复制原报告及摘要；结果目录与源码一致，不从历史绿色继承结果。
      - name: Reconcile required and executed checks
        id: result
        if: always() && needs.plan.result == 'success'
        env:
          IOS_CI_RESULTS: ${{ needs.plan.outputs.directory }}
          IOS_CI_PLAN_STATUS: ${{ needs.plan.result }}
          IOS_CI_CHECKS_STATUS: ${{ needs.checks.result }}
          IOS_CI_LOCAL_STATUS: ${{ needs.local_evidence.result }}
          IOS_CI_IS_PR: ${{ github.event_name == 'pull_request' }}
        run: npm run ci:ios-app -- result --results "$IOS_CI_RESULTS"
      - name: Require every selected job
        if: always()
        env:
          IOS_CI_PLAN_STATUS: ${{ needs.plan.result }}
          IOS_CI_CHECKS_STATUS: ${{ needs.checks.result }}
          IOS_CI_LOCAL_STATUS: ${{ needs.local_evidence.result }}
          IOS_CI_IS_PR: ${{ github.event_name == 'pull_request' }}
        run: npm run ci:ios-app -- require-jobs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ci-result-${{ github.run_attempt }}
          path: ${{ needs.plan.outputs.directory }}/ci-result.*
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
