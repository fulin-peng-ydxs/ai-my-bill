name: offline-ios

# 日常分支 push/PR 不运行远端；请求范围由同一登记、规划器和结果对账器维护。
on:
  push:
    tags:
      - 'ios-ci/scripts/**'
      - 'ios-ci/app/**'
      - 'ios-ci/final/**'
      - 'ios-ci/change/**'
      - 'ios-ci/dependency-audit/**'
  workflow_dispatch:
    inputs:
      verification:
        description: 'scripts=工具；change=按变更专项；app=集成；final=完整候选；dependency-audit=依赖审计'
        required: true
        default: scripts
        type: choice
        options:
          - scripts
          - change
          - app
          - final
          - dependency-audit
      base_revision:
        description: 'change 必填：变更起点完整 SHA'
        type: string

permissions:
  contents: read

concurrency:
  group: offline-ios-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.verification || 'tag' }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      directory: ${{ steps.plan.outputs.directory }}
      profile: ${{ steps.plan.outputs.profile }}
      artifact: ${{ steps.plan.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate registry and plan required suites
        id: plan
        run: npm run ci:ios-app -- prepare
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: ${{ steps.plan.outputs.directory }}/ci-plan.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  checks:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # 同组顺序执行、独立模拟器复用；关闭标记失败仍清理已登记组并保留失败。
    # 正式执行/清理预算不变；受控回归仅独立缩短清理宽限，等待就绪后取消。
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: ${{ needs.plan.outputs.directory }}
      - env:
          IOS_CI_RESULTS: ${{ needs.plan.outputs.directory }}
          IOS_CI_GROUP: ${{ matrix.group }}
        run: npm run ci:ios-app -- run --results "$IOS_CI_RESULTS" --group "$IOS_CI_GROUP"
      - name: Preserve this attempt independently
        if: always()
        env:
          IOS_CI_RESULTS: ${{ needs.plan.outputs.directory }}
          IOS_CI_GROUP: ${{ matrix.group }}
          IOS_CI_ATTEMPT: ${{ github.run_attempt }}
        run: npm run ci:ios-app -- archive --results "$IOS_CI_RESULTS" --group "$IOS_CI_GROUP" --attempt "$IOS_CI_ATTEMPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ci-executed-${{ matrix.group }}-${{ github.run_attempt }}
          path: .local/ios/tmp/ai-agent/ios-ci-archives/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-diagnostics-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            .local/ios/tmp/ai-agent/ios-invocation-*/*.json
            .local/ios/tmp/ai-agent/ios-verification-state.json
            .local/ios/tmp/ai-agent/ios-process-*/*.json
            .local/ios/tmp/ai-agent/ios-debug-*/run-*/*.xcresult
            .local/ios/tmp/ai-agent/native-*/*.xcresult
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  result:
    if: always() && needs.plan.result == 'success'
    needs: [plan, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      complete: ${{ steps.result.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: ${{ needs.plan.outputs.directory }}
      - uses: actions/download-artifact@v4
        with:
          pattern: ios-ci-executed-*
          path: ${{ needs.plan.outputs.directory }}/archives
          merge-multiple: true
      # 同一对账器核验必需阶段/构建成功记录及 TAP 的 TODO、平台跳过，不只检查退出码。
      # 各组复制原报告及摘要；结果目录与源码一致，不从历史绿色继承结果。
      - name: Reconcile required and executed checks
        id: result
        env:
          IOS_CI_RESULTS: ${{ needs.plan.outputs.directory }}
          IOS_CI_CHECKS_STATUS: ${{ needs.checks.result }}
        run: npm run ci:ios-app -- result --results "$IOS_CI_RESULTS"
      - name: Require selected jobs
        if: always()
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ci-result-${{ github.run_attempt }}
          path: ${{ needs.plan.outputs.directory }}/ci-result.*
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  # 只有最终计划、实际报告及所有必需 job 均通过才标记完整候选；真机验收仍另行执行。
  app-baseline-v1:
    needs: [plan, checks, result]
    if: >-
      needs.plan.outputs.profile == 'final' && needs.checks.result == 'success' &&
      needs.result.result == 'success' && needs.result.outputs.complete == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo 'Full App candidate reconciled; device acceptance remains separate'
